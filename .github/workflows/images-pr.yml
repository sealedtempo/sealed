# Pull request check for the runtime images (D-028): every image whose Dockerfile or image directory the
# pull request changes is built twice for linux/amd64, the second time without cache, and both builds must
# give the same digest. This is the check images.yml runs on main before it pins a digest, so a build that
# writes the build time into the image fails here instead of after the merge. Nothing is pushed or signed,
# and the jobs get a read-only token and no secrets.
# The paths below cover every image directory LoadImages reports (TestImagesPRWorkflowShape checks this), so
# a change inside an image's build directory runs the check. A root-context image also rebuilds on main for
# broader inputs it copies (go.mod, packages/**, config/defaults.yaml); those are gated by images.yml only.
# A separate workflow from images.yml for two reasons: the workflow policy keeps repository secrets
# (images.yml's PIN_PR_TOKEN) out of every workflow that pull requests trigger, and images.yml's single
# concurrency slot must not be shared with pull requests.
name: images-pr
on:
  pull_request:
    paths:
      - "**/Dockerfile"
      - "**/Dockerfile.dockerignore"
      - catalog/apps/**/images/**
      - runtime/**
      - verifier/**
      - key-broker/**
      - catalog/tools/release/images.yaml
      - scripts/release/build-image.sh
      - .github/workflows/images-pr.yml
permissions: {}
concurrency:
  group: images-pr-${{ github.ref }}
  cancel-in-progress: true
env:
  GO_VERSION: "1.27.3"
  BUILDX_VERSION: v0.38.0
  # The same BuildKit as images.yml: the digests only match with the same builder.
  BUILDKIT_IMAGE: moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ env.GO_VERSION }}" }
      # Only the images the pull request changes, without the unbuilt ones that images.yml also builds.
      - name: Plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA" HEAD >"$RUNNER_TEMP/changed.txt"
          go run ./catalog/tools/release images --format build-matrix --changed "$RUNNER_TEMP/changed.txt" --changed-only >"$RUNNER_TEMP/matrix.json"
          {
            echo "matrix=$(jq -c . "$RUNNER_TEMP/matrix.json")"
            echo "count=$(jq '.include | length' "$RUNNER_TEMP/matrix.json")"
          } >>"$GITHUB_OUTPUT"
          jq -r '"images to check: " + ([.include[].name] | join(", "))' "$RUNNER_TEMP/matrix.json"
  reproducible:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The model image and the flattened app images need more than the runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker-container
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Build twice and compare the digests
        env:
          ENTRY: ${{ toJSON(matrix) }}
          NAME: ${{ matrix.name }}
        run: |
          scripts/release/build-image.sh --entry "$ENTRY" --out "$RUNNER_TEMP/$NAME.json" --commit "$GITHUB_SHA" --verify-reproducible
          jq . "$RUNNER_TEMP/$NAME.json"
