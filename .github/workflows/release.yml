# Release job (spec 6.8, D-046, D-038), on merge to main: for every registered app whose release_version is
# not onchain yet (or the apps given to a manual run):
#   1. plan from the onchain state, not from the push diff, so a push whose run the single-slot concurrency
#      group dropped is released by the next run (supply-6): only registered apps (OWNER registers them with
#      contracts/script/RegisterCatalog.s.sol and contracts/catalog/catalog.mainnet.json, never CI), every
#      image built and pinned, a releasable version; a push run skips apps that are not ready yet;
#   2. mirror the app's upstream images to the catalog registry, digest for digest;
#   3. build: every built image (manifest `source: build:`) must carry the cosign signature of images.yml on
#      main (supply-3), then Syft SBOM and Grype scan per image from the catalog registry, the waivers gate,
#      the bundle with `sealed release build` (checked byte for byte against the composer library), the
#      release-mode lint, and cosign keyless signing through GitHub OIDC (Fulcio certificate, Rekor entry);
#   4. SLSA build provenance for every bundle with slsa-github-generator;
#   5. publish: a GitHub Release named <appId>-v<version> with the bundle, .sig, .crt, .sigstore.json,
#      .intoto.jsonl, SBOMs, scans and release.json, fetched back by its public URL and checked against
#      bundleHash, then AppRegistry.publishRelease on Tempo mainnet with the OPS key (environment mainnet),
#      after making sure the OPS fee token preference is FEE_TOKEN; the tx hash goes into the release notes.
#      Onchain, signatureURI is the .sigstore.json URL (G13: cosign 3 verifies a blob with --bundle) and
#      provenanceURI the .intoto.jsonl URL. A GitHub Release that already exists is used only when
#      github-actions[bot] created it and its bundle is the one this run built or is signed by release.yml on
#      main (supply-1).
name: release
on:
  push:
    branches: [main]
    paths:
      - catalog/apps/**
  workflow_dispatch:
    inputs:
      apps:
        description: Comma-separated app ids to release, or "all" (versions already released are skipped)
        type: string
        required: true
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
env:
  GO_VERSION: "1.27.3"
  # D-053: Foundry v1.8.6; mainnet sends keep the D-038 path (fee token preference set once per account).
  FOUNDRY_VERSION: v1.8.6
  SYFT_VERSION: v1.55.0
  GRYPE_VERSION: v0.121.0
  COSIGN_VERSION: v3.1.4
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ env.GO_VERSION }}" }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: "${{ env.FOUNDRY_VERSION }}" }
      - name: Plan (read-only chain and GitHub checks)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          APPS: ${{ inputs.apps }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TEMPO_RPC_URL: ${{ secrets.TEMPO_RPC_URL }}
        # A push plans every app whose release_version is not onchain (the chain is the record of what is
        # released), never the diff to github.event.before: that diff misses a push whose run was dropped
        # while another one waited in the concurrency group (supply-6).
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            sel=(--apps "$APPS")
          else
            sel=(--apps all --skip-unready)
          fi
          scripts/release/plan-releases.sh release "${sel[@]}" --out "$RUNNER_TEMP/plan.json"
          {
            echo "matrix=$(jq -c '{include: .include}' "$RUNNER_TEMP/plan.json")"
            echo "count=$(jq .count "$RUNNER_TEMP/plan.json")"
            echo "apps=$(jq -r '[.include[].app] | join(",")' "$RUNNER_TEMP/plan.json")"
          } >>"$GITHUB_OUTPUT"
  mirror:
    needs: plan
    if: needs.plan.outputs.count != '0'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/mirror.yml
    with:
      apps: ${{ needs.plan.outputs.apps }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  build:
    needs: [plan, mirror]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      id-token: write # cosign keyless signing (Fulcio certificate for this workflow's identity)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ env.GO_VERSION }}" }
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with: { syft-version: "${{ env.SYFT_VERSION }}" }
      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with: { grype-version: "${{ env.GRYPE_VERSION }}" }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: "${{ env.COSIGN_VERSION }}" }
      - name: Tools
        run: |
          go build -o "$RUNNER_TEMP/bin/sealed-release" ./catalog/tools/release
          go build -o "$RUNNER_TEMP/bin/sealed-compose" ./runtime/composer/cmd/sealed-compose
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Registry login (read)
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      # supply-3: a built image's digest is released only if images.yml on main signed it.
      - name: Built images are signed by images.yml on main
        env:
          REFS: ${{ toJSON(matrix.imageRefs) }}
          GH_REPO: ${{ github.repository }}
          SEALED_RELEASE_BIN: ${{ runner.temp }}/bin/sealed-release
        run: |
          while IFS= read -r ref; do
            scripts/release/verify-image.sh --ref "$ref"
          done < <(jq -r '.[] | select(.built) | .ref' <<<"$REFS")
      # SBOM and scan of exactly what VMs pull: <registry>/<name>@<digest>.
      - name: SBOM, Grype and waivers
        env:
          APP: ${{ matrix.app }}
          REFS: ${{ toJSON(matrix.imageRefs) }}
          SEALED_RELEASE_BIN: ${{ runner.temp }}/bin/sealed-release
        run: |
          # download-syft/download-grype only expose a cmd path (they do not add it to PATH); scan-image.sh needs both.
          grype_dir="$(dirname '${{ steps.grype.outputs.cmd }}')"
          syft_dir="$(dirname '${{ steps.syft.outputs.cmd }}')"
          export PATH="$grype_dir:$syft_dir:$PATH"
          while IFS=$'\t' read -r name ref; do
            scripts/release/scan-image.sh --image "$name" --ref "$ref" --waivers "catalog/apps/$APP/waivers.yaml" --out "$RUNNER_TEMP/scan"
          done < <(jq -r '.[] | [.name, .ref] | @tsv' <<<"$REFS")
      - name: Upload SBOMs (diagnostic, for license-override authoring)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.app }}
          path: ${{ runner.temp }}/scan/sbom
          if-no-files-found: warn
          retention-days: 7
      - name: Bundle (sealed release build, cross-check, release lint)
        env:
          APP: ${{ matrix.app }}
          BUNDLE: ${{ matrix.assets.bundle }}
          ALLOW_MISSING_SEALED_CLI: ${{ vars.ALLOW_MISSING_SEALED_CLI }}
          SEALED_RELEASE_BIN: ${{ runner.temp }}/bin/sealed-release
          SEALED_COMPOSE_BIN: ${{ runner.temp }}/bin/sealed-compose
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          scripts/release/build-bundle.sh --app "$APP" --sbom-dir "$RUNNER_TEMP/scan/sbom" --files-dir "$RUNNER_TEMP/scan/files" \
            --scan-dir "$RUNNER_TEMP/scan/scan" --out "$RUNNER_TEMP/dist/$BUNDLE" --info "$RUNNER_TEMP/info.json"
      - name: Sign (cosign keyless, Rekor)
        env:
          BUNDLE: ${{ matrix.assets.bundle }}
          SEALED_RELEASE_BIN: ${{ runner.temp }}/bin/sealed-release
        run: scripts/release/sign-bundle.sh --bundle "$RUNNER_TEMP/dist/$BUNDLE"
      - name: Release assets and release.json
        env:
          BUNDLE: ${{ matrix.assets.bundle }}
          RELEASE_JSON: ${{ matrix.assets.releaseJson }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          dist="$RUNNER_TEMP/dist"
          for f in "$RUNNER_TEMP"/scan/sbom/*.spdx.json; do n="$(basename "$f" .spdx.json)"; cp "$f" "$dist/sbom.$n.spdx.json"; done
          for f in "$RUNNER_TEMP"/scan/scan/*.json; do n="$(basename "$f" .json)"; cp "$f" "$dist/scan.$n.json"; done
          rm -f "$dist/$BUNDLE.rekor.json"
          sealed-release release-doc --bundle "$dist/$BUNDLE" --scans "$RUNNER_TEMP/scan/summary" --sigstore "$dist/$BUNDLE.sigstore.json" \
            --commit "$GITHUB_SHA" --run-url "$RUN_URL" --identity "https://github.com/$GITHUB_WORKFLOW_REF" --out "$dist/$RELEASE_JSON"
          ls -l "$dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.app }}
          path: |
            ${{ runner.temp }}/dist
            ${{ runner.temp }}/info.json
          if-no-files-found: error
          retention-days: 90
  subjects:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/releases
      - name: Bundle digests (sha256sum format, base64)
        id: hashes
        run: |
          cd "$RUNNER_TEMP/releases"
          files="$(find . -name '*.bundle.tar' -type f | LC_ALL=C sort)"
          [ -n "$files" ] || { echo "::error::no bundles"; exit 1; }
          sums="$(for f in $files; do (cd "$(dirname "$f")" && sha256sum "$(basename "$f")"); done)"
          printf '%s\n' "$sums"
          echo "hashes=$(printf '%s\n' "$sums" | base64 -w0)" >>"$GITHUB_OUTPUT"
  # The SLSA generator has to be called by its vX.Y.Z tag (it rejects SHA references, because its
  # provenance names the builder by tag), so this job checks the tag still points at the reviewed commit.
  slsa-pin:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: slsa-github-generator v2.1.0 is commit f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api repos/slsa-framework/slsa-github-generator/git/ref/tags/v2.1.0 --jq '.object.sha')"
          [ "$sha" = f7dd8c54c2067bafc12ca7a55595d5ee9b75204a ] || { echo "::error::tag v2.1.0 moved to $sha"; exit 1; }
  provenance:
    needs: [subjects, slsa-pin]
    permissions:
      actions: read # detect the GitHub Actions environment
      id-token: write # sign the provenance
      contents: write # required by the generator (assets are uploaded by the publish job, not here)
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.subjects.outputs.hashes }}
      provenance-name: bundles.intoto.jsonl
      upload-assets: false
  publish:
    needs: [plan, build, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Environment secrets (OPS_PRIVATE_KEY) and its protection rules (required reviewers, main only).
    environment: mainnet
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1 # one OPS transaction at a time (nonces)
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ env.GO_VERSION }}" }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with: { version: "${{ env.FOUNDRY_VERSION }}" }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: "${{ env.COSIGN_VERSION }}" }
      - run: go build -o "$RUNNER_TEMP/bin/sealed-release" ./catalog/tools/release && echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.app }}
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: ${{ runner.temp }}/provenance
      - name: GitHub Release
        id: gh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ matrix.tag }}
          PROVENANCE: ${{ matrix.assets.provenance }}
          RELEASE_JSON: ${{ matrix.assets.releaseJson }}
          SEALED_RELEASE_BIN: ${{ runner.temp }}/bin/sealed-release
        run: |
          dist="$RUNNER_TEMP/release/dist"
          cp "$RUNNER_TEMP/provenance/bundles.intoto.jsonl" "$dist/$PROVENANCE"
          sealed-release notes --release "$dist/$RELEASE_JSON" >"$RUNNER_TEMP/notes.md"
          state="$(scripts/release/github-release.sh publish --tag "$TAG" --target "$GITHUB_SHA" --notes "$RUNNER_TEMP/notes.md" --assets "$dist")"
          echo "state=$state" >>"$GITHUB_OUTPUT"
      # Onchain publication uses the bundle the public release serves. A re-run after a published release
      # (for example after a failed transaction) takes that release's own release.json and bundle.
      # A tag names the version without a leading v (composer.TagVersion), so 1.2.3 and v1.2.3 share one tag:
      # a published release of the other spelling must fail this run, not be published under this version.
      # supply-1: anyone with contents:write can publish a GitHub Release under the tag while this job waits
      # for its reviewers. github-release.sh already refused a release github-actions[bot] did not create; an
      # existing release's bundle is then used only if it is the bundle this run built (same sha256) or
      # cosign verifies it against release.yml on main, the GitHub OIDC issuer and this run's own commit
      # (--certificate-github-workflow-sha, OID 1.3.6.1.4.1.57264.1.3), so a signature from an earlier run
      # of this same run's commit is accepted but one from any other commit on main is not. Anything else
      # stops here, before the OPS key is used.
      - name: Fetch the bundle by its public URL (D-046)
        env:
          STATE: ${{ steps.gh.outputs.state }}
          APP: ${{ matrix.app }}
          TAG: ${{ matrix.tag }}
          VERSION: ${{ matrix.version }}
          BUNDLE: ${{ matrix.assets.bundle }}
          SIGSTORE: ${{ matrix.assets.sigstoreBundle }}
          RELEASE_JSON: ${{ matrix.assets.releaseJson }}
          BASE_URL: ${{ matrix.assets.baseUrl }}
          REPO: ${{ github.repository }}
          SEALED_RELEASE_BIN: ${{ runner.temp }}/bin/sealed-release
        run: |
          mkdir -p "$RUNNER_TEMP/public"
          if [ "$STATE" = exists ]; then
            curl -fsSL --proto '=https' -o "$RUNNER_TEMP/public/release.json" "$BASE_URL/$RELEASE_JSON" ||
              { echo "::error::release $TAG is already published without $RELEASE_JSON: another spelling of $VERSION (1.2.3 and v1.2.3 share a tag) owns it; set release_version"; exit 1; }
          else
            cp "$RUNNER_TEMP/release/dist/$RELEASE_JSON" "$RUNNER_TEMP/public/release.json"
          fi
          published="$(jq -r .version "$RUNNER_TEMP/public/release.json")"
          [ "$published" = "$VERSION" ] ||
            { echo "::error::release $TAG serves version $published, this run publishes $VERSION (1.2.3 and v1.2.3 share a tag); set release_version"; exit 1; }
          hash="$(jq -r .bundleHash "$RUNNER_TEMP/public/release.json")"
          scripts/release/github-release.sh fetch --url "$BASE_URL/$BUNDLE" --sha256 "$hash" --out "$RUNNER_TEMP/public/$BUNDLE"
          sealed-release info --bundle "$RUNNER_TEMP/public/$BUNDLE" >"$RUNNER_TEMP/public/info.json"
          [ "$(jq -r .releaseId "$RUNNER_TEMP/public/info.json")" = "$(jq -r .releaseId "$RUNNER_TEMP/public/release.json")" ] ||
            { echo "::error::release.json and the public bundle disagree"; exit 1; }
          [ "$(jq -r '"\(.slug) \(.version)"' "$RUNNER_TEMP/public/info.json")" = "$APP $VERSION" ] ||
            { echo "::error::the public bundle of $TAG is $(jq -r '"\(.slug) \(.version)"' "$RUNNER_TEMP/public/info.json"), not $APP $VERSION"; exit 1; }
          if [ "$STATE" = exists ]; then
            own="$(sealed-release info --bundle "$RUNNER_TEMP/release/dist/$BUNDLE" | jq -r .bundleHash)"
            if [ "$hash" = "$own" ]; then
              echo "ok   $TAG serves the bundle this run built ($hash)"
            else
              identity="https://github.com/$REPO/.github/workflows/release.yml@refs/heads/main"
              curl -fsSL --proto '=https' -o "$RUNNER_TEMP/public/$SIGSTORE" "$BASE_URL/$SIGSTORE" ||
                { echo "::error::$TAG serves bundle $hash, not the bundle this run built ($own), and has no $SIGSTORE"; exit 1; }
              cosign verify-blob --bundle "$RUNNER_TEMP/public/$SIGSTORE" --certificate-identity "$identity" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-github-workflow-sha "$GITHUB_SHA" "$RUNNER_TEMP/public/$BUNDLE" ||
                { echo "::error::$TAG serves bundle $hash, not the bundle this run built ($own), and it is not signed by $identity at this run's commit $GITHUB_SHA; nothing is published onchain"; exit 1; }
              echo "ok   $TAG serves bundle $hash, signed by $identity at $GITHUB_SHA"
            fi
          fi
      # Spend guard (R5, G26): refuse before the OPS key is used if the mainnet ledger total would cross the
      # $50 cap, or if this (non-acceptance) publishRelease is past the $40 line. The ledger lives in the
      # private repo, so CI passes its running total through the SEALED_LEDGER_TOTAL_USD repo variable;
      # keep it current from the ledger's running-total line. Unset, it is treated as $0 with a warning.
      - name: Budget cap guard
        env:
          SEALED_LEDGER_TOTAL_USD: ${{ vars.SEALED_LEDGER_TOTAL_USD }}
        run: scripts/release/check-budget.sh
      - name: AppRegistry.publishRelease on Tempo mainnet (OPS)
        env:
          OPS_PRIVATE_KEY: ${{ secrets.OPS_PRIVATE_KEY }}
          TEMPO_RPC_URL: ${{ secrets.TEMPO_RPC_URL }}
          BASE_URL: ${{ matrix.assets.baseUrl }}
          PROVENANCE: ${{ matrix.assets.provenance }}
          SIGSTORE: ${{ matrix.assets.sigstoreBundle }}
          SEALED_RELEASE_BIN: ${{ runner.temp }}/bin/sealed-release
        # signatureURI is stored onchain for good, so it names the Sigstore bundle (signature, certificate and
        # Rekor proof in one file), which cosign 3 verifies with --bundle; the .sig/.crt pair is deprecated (G13).
        run: |
          scripts/release/publish-release.sh --info "$RUNNER_TEMP/public/info.json" \
            --provenance-uri "$BASE_URL/$PROVENANCE" --signature-uri "$BASE_URL/$SIGSTORE" \
            --out "$RUNNER_TEMP/onchain.json" 2> >(tee "$RUNNER_TEMP/publish.log" >&2)
      - name: Release notes with the transaction
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ matrix.tag }}
          RELEASE_JSON: ${{ matrix.assets.releaseJson }}
          SEALED_RELEASE_BIN: ${{ runner.temp }}/bin/sealed-release
        run: |
          out="$RUNNER_TEMP/final"
          mkdir -p "$out"
          sealed-release release-doc --base "$RUNNER_TEMP/public/release.json" --onchain "$RUNNER_TEMP/onchain.json" --out "$out/$RELEASE_JSON"
          sealed-release notes --release "$out/$RELEASE_JSON" >"$RUNNER_TEMP/notes.md"
          scripts/release/github-release.sh notes --tag "$TAG" --notes "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" "$out/$RELEASE_JSON" --clobber
          {
            echo "### $TAG"
            echo
            jq -r '"publishRelease: \(.txHash) (block \(.blockNumber), fee \(.feeUsd // "?") USD)"' "$RUNNER_TEMP/onchain.json"
            echo
            echo "MAINNET_LEDGER.md row (copy into the private repo):"
            echo
            grep '^| ' "$RUNNER_TEMP/publish.log" || echo "(already published earlier; see that run)"
          } >>"$GITHUB_STEP_SUMMARY"
