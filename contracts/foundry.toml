# Sealed contracts. Foundry 1.8.6, Solidity 0.8.38, OpenZeppelin Contracts 5.7.0 (Soldeer).
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["dependencies"]
solc_version = "0.8.38"
# Tempo targets the Osaka hard fork (docs: quickstart/evm-compatibility).
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
# Tempo network features in forge/cast/anvil (TIP-20 precompiles, Tempo gas schedule, Tempo transactions).
network = "tempo"
# Execute tests, scripts and forks with mainnet's Tempo hardfork (gas schedule, TIP-403 registry binding, precompiles).
# Mainnet runs T12 until T13 activates on 2026-11-03 15:00 UTC: change this to "tempo:t13" then. Foundry 1.8.6 knows
# T0..T14; forks follow this setting, not the fork block, so a stale value brings back the pre-T9 policy reads.
hardfork = "tempo:t12"
auto_detect_remappings = false
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./catalog" },
    { access = "read", path = "./broadcast" },
    { access = "read", path = "./out" },
]

# Mainnet broadcasts (D-038). Same compiler settings (identical bytecode), but standard EIP-1559 transactions. With
# gas left to the node, forge/cast still send the eth_estimateGas request for a Tempo 0x76 contract creation without
# the creation in `calls`, which mainnet rejects ("empty calls list"). Fees are paid in the sender's
# FeeManager.setUserToken preference (make fee-token-pref).
[profile.deploy]
network = "ethereum"
hardfork = "osaka"

[profile.default.fuzz]
runs = 256
seed = "0x5ea1ed"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 1000

[profile.ci.invariant]
runs = 256
depth = 100

# Foundry has no "${VAR:-default}" syntax: `tempo` needs TEMPO_RPC_URL set. The Makefile exports it with a
# fallback to the public RPC when it is unset or empty; outside make use `tempo_public` or export it yourself.
# The fork tests fall back to the public RPC on their own.
[rpc_endpoints]
tempo = "${TEMPO_RPC_URL}"
tempo_public = "https://rpc.tempo.xyz"
local = "http://127.0.0.1:8545"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = false

# forge lint runs on every build. Foundry 1.8.6 flags each `vm.warp(block.timestamp + n)` in the tests (75 hits);
# the 20 findings in src/ stay visible.
[lint]
exclude_lints = ["environment-read-across-mutation"]

[soldeer]
remappings_generate = false
remappings_regenerate = false
recursive_deps = false

[dependencies]
"@openzeppelin-contracts" = "5.7.0"
forge-std = "1.17.0"
