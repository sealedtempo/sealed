# The syft configuration scripts/release/syft-env.sh passes with -c, so that nothing outside this
# repository can change what an SBOM lists. syft, given -c, loads only the configuration file(s)
# named and ignores every auto-discovered one: .syft.yaml and .syft/config.yaml in the working
# directory (the repository root in the catalog and release workflows), and ~/.syft.yaml and the XDG
# config under HOME on the runner. Those files set exclude, scope, select-catalogers, enrich and more,
# which the SYFT_* variables do not pin, so a committed or planted config would otherwise make the
# release scan and the lint fixture list different files. The Go-license and file-metadata settings
# stay in syft-env.sh (the two file selections differ per scan); this file pins the rest of what
# decides an SBOM's contents to syft's defaults.
check-for-app-update: false
scope: squashed
# pip vendors distlib, whose Windows launcher stubs (t32/t64/w32/w64[-arm].exe under
# pip/_vendor/distlib) syft's binary classifier reports as a package "Simple Launcher" with no purl
# and no license. They are inert PE files on the Linux images (never executed) and cannot be given a
# reviewed license override (no purl to key on), so exclude them from the SBOM. The "**/" prefix
# matches the in-image path with or without a leading slash.
exclude:
  - "**/pip/_vendor/distlib/*.exe"
  - "**/distlib/*.exe"
  # ToolJet (internal-tools) node_modules: syft catalogs per-export-subpath and build/metadata
  # package.json files, test/benchmark/example fixtures, npm security-hold placeholder stubs, and
  # schematic EJS templates as if each were a separate dependency. None are shipped packages (the real
  # package is cataloged from its own top-level node_modules/<pkg>/package.json, which these globs never
  # match: each requires a path segment after the package dir, except the three deliberate placeholder
  # drops). Keeping them would mean fabricating license overrides for non-packages.
  - "**/node_modules/rxjs/*/package.json"
  - "**/node_modules/libphonenumber-js/*/**/package.json"
  - "**/node_modules/@angular-devkit/schematics/*/package.json"
  - "**/node_modules/@angular-devkit/schematics-cli/**/package.json"
  - "**/node_modules/@casl/ability/*/package.json"
  - "**/node_modules/@socket.io/component-emitter/lib/*/package.json"
  - "**/node_modules/engine.io-client/build/*/package.json"
  - "**/node_modules/engine.io-parser/build/*/package.json"
  - "**/node_modules/@nestjs/schematics/dist/**/package.json"
  - "**/node_modules/web-streams-polyfill/*/**/package.json"
  - "**/node_modules/*/test/**/package.json"
  - "**/node_modules/*/tests/**/package.json"
  - "**/node_modules/*/benchmark/**/package.json"
  - "**/node_modules/*/benchmarks/**/package.json"
  - "**/node_modules/*/example/**/package.json"
  - "**/node_modules/*/examples/**/package.json"
  - "**/node_modules/*/fixtures/**/package.json"
  - "**/node_modules/package/**/package.json"
  - "**/node_modules/package.json/package.json"
  - "**/node_modules/save-dev/package.json"
  # supervisord is apt-installed (the deb package is an OS component, a warning); syft also catalogs its
  # Python egg-info as a pypi package whose repoze "BSD-derived" license has no SPDX id. Drop the pypi
  # duplicate; the deb entry remains.
  - "**/dist-packages/supervisor-*.egg-info/**"
  # ssh2 bundles a Windows PuTTY pageant helper (ssh2/util/pagent.exe): an inert PE on the Linux image,
  # no purl and no license, like the distlib launcher stubs above.
  - "**/node_modules/ssh2/util/*.exe"
select-catalogers: []
enrich: []
