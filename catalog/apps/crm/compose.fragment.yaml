# crm: EspoCRM 10.0.11 (server, job daemon), PostgreSQL 16.15, one-shot bootstrap (D-049a).
# All three EspoCRM services run the derived image from images/espocrm (Debian packages plus the
# EspoCRM release). Rules: docs/INTERFACES.md section 14. Every "$" that the shell or Node must
# see is written "$$" so that compose interpolation leaves it alone. Telemetry and update-check
# switches are fixed by sealed-espocrm in data/config-override.php; the manifest's
# telemetry_off_env lists them for the catalog checks.
#
# Route closed until the bootstrap is done: the gate (sealed-agent /v1/gate, D-044) answers 503
# until crm-bootstrap/done.json exists. EspoCRM has no self sign-up and its web installer is not
# in the image, so nobody can create the first admin through the route in any case.
services:
  crm-server:
    image: "{{image:espocrm}}"
    x-sealed-secrets: [PG_DATABASE_PASSWORD]
    # Starts as root only to give the volumes to www-data, then drops to uid 33 with no
    # capabilities (sealed-espocrm). Apache listens on 8080.
    entrypoint: ["/usr/local/bin/sealed-espocrm", "server"]
    volumes:
      - crm-data:/var/www/html/data
      - crm-custom:/var/www/html/custom
      - crm-client-custom:/var/www/html/client/custom
    depends_on:
      crm-db:
        condition: service_healthy
    healthcheck:
      # PHP's HTTP client ignores the composer's HTTP_PROXY, so this reaches Apache directly.
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8080/api/v1/Settings', false, stream_context_create(['http' => ['timeout' => 4]])) === false ? 1 : 0);"
      interval: 10s
      timeout: 5s
      retries: 30
      # The first start waits for crm-bootstrap to install EspoCRM (rebuild takes a minute).
      start_period: 300s
    stop_grace_period: 30s
    mem_limit: 1g

  crm-daemon:
    image: "{{image:espocrm}}"
    x-sealed-secrets: [PG_DATABASE_PASSWORD]
    # EspoCRM's job daemon (scheduled jobs: cleanup, reminders, email queue when configured).
    entrypoint: ["/usr/local/bin/sealed-espocrm", "daemon"]
    volumes:
      - crm-data:/var/www/html/data
      - crm-custom:/var/www/html/custom
      - crm-client-custom:/var/www/html/client/custom
    depends_on:
      crm-db:
        condition: service_healthy
      crm-bootstrap:
        condition: service_completed_successfully
    stop_grace_period: 30s
    mem_limit: 512m

  crm-db:
    image: "{{image:postgres}}"
    x-sealed-secrets: [PG_DATABASE_PASSWORD]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        export POSTGRES_PASSWORD="$$PG_DATABASE_PASSWORD"
        unset PG_DATABASE_PASSWORD
        exec docker-entrypoint.sh "$$@"
      - crm-db
    command: ["postgres"]
    environment:
      POSTGRES_DB: "espocrm"
      POSTGRES_USER: "espocrm"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - crm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U espocrm -h localhost -d espocrm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    shm_size: 256m
    mem_limit: 1g

  # One-shot job: EspoCRM install with its CLI, admin login, account check, the "Sealed API" role
  # and API user (key in crm-bootstrap/api-key.json), settings check, then
  # crm-bootstrap/done.json. On later starts it only re-checks the settings, read-only.
  crm-bootstrap:
    image: "{{image:espocrm}}"
    x-sealed-secrets: [PG_DATABASE_PASSWORD, ADMIN_PASSWORD]
    entrypoint: ["/usr/local/bin/sealed-espocrm", "bootstrap"]
    command:
      - node
      - --input-type=module
      - --eval
      # >>> embedded: bootstrap/bootstrap.mjs (run tools/embed-bootstrap.mjs, do not edit here)
      - |
        // Sealed crm bootstrap for EspoCRM 10.0.
        //
        // Runs inside the VM in the crm image (Node 20 from Debian), as www-data, with the EspoCRM
        // directory as its working directory. The first run installs EspoCRM with its CLI
        // (bin/command: config:populate, rebuild, create-admin-user, set-password,
        // populate-scheduled-jobs, app-check, isInstalled), then talks to crm-server over the app
        // network (CRM_BASE_URL, http://crm-server:8080): admin login, a check that nobody else has an
        // account, a "Sealed API" role, an API user for the customer whose key goes to
        // crm-bootstrap/api-key.json, a check that the key works, and a check of the settings Sealed
        // fixes. Then it writes done.json, which opens the crm route (the gate answers 503 until then).
        // Every later start only re-checks those settings, read-only, without the admin password.
        //
        // EspoCRM has no self sign-up, so the first admin is always ours; the account check still fails
        // closed, because a data disk that already holds accounts is not one this job created.
        //
        // Safe to re-run: every step checks what already exists. This file is embedded verbatim into
        // compose.fragment.yaml (tools/embed-bootstrap.mjs), so it may only import node: builtins.
        // Secrets (ADMIN_PASSWORD) arrive as env vars from envexec. They and every token are kept out of
        // logs and error messages.

        import { spawn } from "node:child_process";
        import { mkdir, readFile, rename, rm, writeFile } from "node:fs/promises";
        import { join } from "node:path";

        export const DONE_FILE = "done.json";
        export const API_KEY_FILE = "api-key.json";
        export const ROLE_NAME = "Sealed API";
        // Scopes the customer's API user may use. Full access to the CRM records, nothing in
        // administration (users, roles, settings stay with the admin).
        export const API_ROLE_SCOPES = [
          "Account", "Contact", "Lead", "Opportunity", "Case", "Task", "Call", "Meeting", "Document",
        ];
        // Settings sealed-espocrm writes into data/config-override.php. The bootstrap checks them in
        // the admin's view of GET /api/v1/Settings on the first run and through the CLI on every run.
        export const SETTINGS_EXPECTED = {
          useWebSocket: false,
          adminNotifications: false,
          adminNotificationsNewVersion: false,
          adminNotificationsNewExtensionVersion: false,
          adminPanelIframeDisabled: true,
        };
        // System parameters (never sent to the browser), read with bin/command config:get.
        export const SYSTEM_EXPECTED = {
          adminExtensionUpload: "false",
          adminUpgrade: "false",
          adminUpgradeDisabled: "true",
        };

        export class BootstrapError extends Error {}

        // Someone other than the bootstrap admin and its API user holds an account. Never retried
        // into success: the data has to be deleted and the app deployed again.
        export class UnsafeInstanceError extends BootstrapError {
          constructor(reason) {
            super(`$${reason}. Do not use this instance: delete the crm data and deploy again`);
          }
        }

        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        const trimSlash = (s) => s.replace(/\/+$$/, "");

        export function loadConfig(env) {
          const required = ["CRM_BASE_URL", "STATE_DIR", "ADMIN_USERNAME", "ADMIN_PASSWORD", "API_USER_NAME", "SEALED_PUBLIC_URL_CRM"];
          for (const name of required) {
            if (!env[name]) throw new BootstrapError(`missing env $${name}`);
          }
          if (!/^[a-z][a-z0-9_.-]{1,49}$$/.test(env.ADMIN_USERNAME)) throw new BootstrapError("ADMIN_USERNAME is not a valid EspoCRM user name");
          if (!/^[a-z][a-z0-9_.-]{1,49}$$/.test(env.API_USER_NAME)) throw new BootstrapError("API_USER_NAME is not a valid EspoCRM user name");
          if (env.ADMIN_USERNAME === env.API_USER_NAME) throw new BootstrapError("ADMIN_USERNAME and API_USER_NAME must differ");
          if (env.ADMIN_PASSWORD.length < 8 || env.ADMIN_PASSWORD.length > 128 || /[\r\n]/.test(env.ADMIN_PASSWORD)) {
            throw new BootstrapError("ADMIN_PASSWORD must be 8 to 128 characters on one line");
          }
          const origin = trimSlash(env.SEALED_PUBLIC_URL_CRM);
          if (!/^https:\/\/[A-Za-z0-9.-]+(:\d{1,5})?$$/.test(origin)) throw new BootstrapError("SEALED_PUBLIC_URL_CRM must be https://<host>");
          return {
            baseUrl: trimSlash(env.CRM_BASE_URL),
            origin,
            stateDir: env.STATE_DIR,
            espoDir: env.ESPO_DIR || process.cwd(),
            // The CLI: "php bin/command" in the image; tests point ESPO_COMMAND at a stand-in.
            command: env.ESPO_COMMAND ? [env.ESPO_COMMAND] : ["php", "bin/command"],
            username: env.ADMIN_USERNAME,
            password: env.ADMIN_PASSWORD,
            apiUserName: env.API_USER_NAME,
            healthTimeoutMs: Number(env.HEALTH_TIMEOUT_S || 900) * 1000,
            pollMs: Number(env.POLL_MS || 3000),
            commandTimeoutMs: Number(env.COMMAND_TIMEOUT_S || 900) * 1000,
          };
        }

        // Runs one bin/command subcommand. stdin, when given, is written and closed (set-password reads
        // the new password from it). Output is returned, never logged, so it cannot leak secrets.
        export function espoCommand(cfg, args, { stdin } = {}) {
          const [file, ...pre] = cfg.command;
          return new Promise((resolve, reject) => {
            const child = spawn(file, [...pre, ...args], { cwd: cfg.espoDir, stdio: ["pipe", "pipe", "pipe"] });
            let stdout = "";
            let stderr = "";
            const timer = setTimeout(() => child.kill("SIGKILL"), cfg.commandTimeoutMs);
            child.stdout.on("data", (d) => (stdout += d));
            child.stderr.on("data", (d) => (stderr += d));
            child.on("error", (err) => {
              clearTimeout(timer);
              reject(new BootstrapError(`bin/command $${args[0]}: $${err.code ?? err.message}`));
            });
            child.on("close", (code) => {
              clearTimeout(timer);
              resolve({ code, stdout: stdout.trim(), stderr: stderr.trim() });
            });
            child.stdin.on("error", () => {});
            child.stdin.end(stdin ?? "");
          });
        }

        async function mustRun(cfg, args, opts) {
          const res = await espoCommand(cfg, args, opts);
          if (res.code !== 0) {
            // Only the first line of the output, and never for set-password.
            const detail = args[0] === "set-password" ? "" : `: $${(res.stdout || res.stderr).split("\n")[0].slice(0, 200)}`;
            throw new BootstrapError(`bin/command $${args[0]} exited $${res.code}$${detail}`);
          }
          return res.stdout;
        }

        export async function configGet(cfg, name) {
          const res = await espoCommand(cfg, ["config:get", name]);
          return res.code === 0 ? res.stdout : undefined;
        }

        export async function isInstalled(cfg) {
          return (await configGet(cfg, "isInstalled")) === "true";
        }

        async function waitForDatabase(cfg, log) {
          const deadline = Date.now() + cfg.healthTimeoutMs;
          for (;;) {
            const res = await espoCommand(cfg, ["db:check"]);
            if (res.code === 0) return;
            if (Date.now() >= deadline) throw new BootstrapError("the database did not answer in time");
            log("waiting for crm-db");
            await sleep(cfg.pollMs);
          }
        }

        // EspoCRM's CLI install, the same steps as EspoCRM's own image, with the database settings
        // coming from data/config-internal-override.php (written by sealed-espocrm).
        export async function install(cfg, log) {
          await waitForDatabase(cfg, log);
          log("installing EspoCRM");
          await rm(join(cfg.espoDir, "data/cache"), { recursive: true, force: true });
          await mustRun(cfg, ["config:populate"]);
          await mustRun(cfg, ["config:set", "defaultPermissions.user", "www-data"]);
          await mustRun(cfg, ["config:set", "defaultPermissions.group", "www-data"]);
          await mustRun(cfg, ["rebuild"]);
          const created = await espoCommand(cfg, ["create-admin-user", cfg.username]);
          if (created.code !== 0 && !/already exists/.test(created.stdout)) {
            throw new BootstrapError(`bin/command create-admin-user exited $${created.code}`);
          }
          await mustRun(cfg, ["set-password", cfg.username], { stdin: `$${cfg.password}\n` });
          await mustRun(cfg, ["populate-scheduled-jobs"]);
          await mustRun(cfg, ["config:set", "jobRunInParallel", "true", "--type=bool"]);
          await mustRun(cfg, ["app-check"]);
          await mustRun(cfg, ["config:set", "isInstalled", "true", "--type=bool"]);
        }

        function basic(user, secret) {
          return Buffer.from(`$${user}:$${secret}`).toString("base64");
        }

        // One API call. auth is {password} or {token} for the admin, or {apiKey}.
        export async function api(cfg, method, path, { auth, body, allow = [] } = {}) {
          const headers = { accept: "application/json" };
          if (auth?.password !== undefined) {
            headers["espo-authorization"] = basic(cfg.username, auth.password);
            headers["espo-authorization-by-token"] = "false";
          } else if (auth?.token !== undefined) {
            headers["espo-authorization"] = basic(cfg.username, auth.token);
            headers["espo-authorization-by-token"] = "true";
          } else if (auth?.apiKey !== undefined) {
            headers["x-api-key"] = auth.apiKey;
          }
          if (body !== undefined) headers["content-type"] = "application/json";
          let res;
          try {
            res = await fetch(`$${cfg.baseUrl}/api/v1$${path}`, {
              method,
              headers,
              body: body === undefined ? undefined : JSON.stringify(body),
              signal: AbortSignal.timeout(60_000),
            });
          } catch (err) {
            throw new BootstrapError(`$${method} $${path.split("?")[0]}: $${err.cause?.code ?? err.name}`);
          }
          const text = await res.text();
          if (!res.ok && !allow.includes(res.status)) {
            throw new BootstrapError(`$${method} $${path.split("?")[0]}: HTTP $${res.status}`);
          }
          let json;
          try {
            json = text ? JSON.parse(text) : undefined;
          } catch {
            if (res.ok) throw new BootstrapError(`$${method} $${path.split("?")[0]}: the response is not JSON`);
          }
          return { status: res.status, json };
        }

        export async function waitForServer(cfg, log) {
          const deadline = Date.now() + cfg.healthTimeoutMs;
          for (;;) {
            try {
              const res = await api(cfg, "GET", "/Settings");
              if (res.json && typeof res.json === "object") return res.json;
            } catch (err) {
              if (!(err instanceof BootstrapError)) throw err;
            }
            if (Date.now() >= deadline) throw new BootstrapError("crm-server did not become ready in time");
            log("waiting for crm-server");
            await sleep(cfg.pollMs);
          }
        }

        export async function adminLogin(cfg) {
          const res = await api(cfg, "GET", "/App/user", { auth: { password: cfg.password }, allow: [401] });
          if (res.status === 401) throw new BootstrapError("the admin login was refused");
          const user = res.json?.user;
          if (user?.type !== "admin" || user?.userName !== cfg.username) {
            throw new UnsafeInstanceError("the bootstrap account is not an EspoCRM admin");
          }
          if (!res.json.token) throw new BootstrapError("GET /App/user returned no token");
          return { token: res.json.token, userId: user.id };
        }

        const listQuery = (params) =>
          new URLSearchParams({ maxSize: "200", offset: "0", ...params }).toString();

        // Fails unless the only accounts are the admin, the API user (once created) and EspoCRM's
        // built-in system user.
        export async function checkSoleOwner(cfg, token) {
          const res = await api(cfg, "GET", `/User?$${listQuery({ select: "id,userName,type,isActive" })}`, { auth: { token } });
          const list = res.json?.list;
          if (!Array.isArray(list)) throw new BootstrapError("GET /User returned no list");
          if (typeof res.json.total === "number" && res.json.total > list.length) {
            throw new UnsafeInstanceError("EspoCRM has more accounts than this job created");
          }
          for (const u of list) {
            if (u.type === "system") continue;
            if (u.userName === cfg.username && u.type === "admin") continue;
            if (u.userName === cfg.apiUserName && u.type === "api") continue;
            throw new UnsafeInstanceError("EspoCRM has accounts other than the bootstrap admin and its API user");
          }
        }

        function roleData() {
          const levels = { create: "yes", read: "all", edit: "all", delete: "all", stream: "all" };
          return Object.fromEntries(API_ROLE_SCOPES.map((scope) => [scope, { ...levels }]));
        }

        export async function ensureRole(cfg, token) {
          const where = { "where[0][type]": "equals", "where[0][attribute]": "name", "where[0][value]": ROLE_NAME };
          const found = await api(cfg, "GET", `/Role?$${listQuery({ select: "id,name", ...where })}`, { auth: { token } });
          const existing = (found.json?.list ?? []).find((r) => r.name === ROLE_NAME);
          if (existing?.id) return existing.id;
          const created = await api(cfg, "POST", "/Role", {
            auth: { token },
            body: {
              name: ROLE_NAME,
              data: roleData(),
              fieldData: {},
              assignmentPermission: "all",
              userPermission: "all",
              exportPermission: "yes",
              massUpdatePermission: "yes",
            },
          });
          if (!created.json?.id) throw new BootstrapError("POST /Role: response has no id");
          return created.json.id;
        }

        async function readState(cfg, name) {
          try {
            return JSON.parse(await readFile(join(cfg.stateDir, name), "utf8"));
          } catch (err) {
            if (err.code === "ENOENT") return undefined;
            throw new BootstrapError(`$${name} is unreadable`);
          }
        }

        async function writeState(cfg, name, value, mode = 0o600) {
          await mkdir(cfg.stateDir, { recursive: true });
          const target = join(cfg.stateDir, name);
          const tmp = `$${target}.tmp`;
          await writeFile(tmp, `$${JSON.stringify(value, null, 2)}\n`, { mode });
          await rename(tmp, target);
        }

        async function findApiUser(cfg, token) {
          const where = { "where[0][type]": "equals", "where[0][attribute]": "userName", "where[0][value]": cfg.apiUserName };
          const found = await api(cfg, "GET", `/User?$${listQuery({ select: "id,userName,type", ...where })}`, { auth: { token } });
          return (found.json?.list ?? []).find((u) => u.userName === cfg.apiUserName);
        }

        // The customer's API user: EspoCRM generates the key on create and shows it to admins only.
        export async function ensureApiUser(cfg, token, roleId) {
          const saved = await readState(cfg, API_KEY_FILE);
          let user = await findApiUser(cfg, token);
          if (user && user.type !== "api") throw new UnsafeInstanceError(`the account $${cfg.apiUserName} is not an API user`);
          if (!user) {
            const created = await api(cfg, "POST", "/User", {
              auth: { token },
              body: {
                userName: cfg.apiUserName,
                type: "api",
                authMethod: "ApiKey",
                lastName: "Sealed customer API",
                isActive: true,
                rolesIds: [roleId],
              },
            });
            if (!created.json?.id) throw new BootstrapError("POST /User: response has no id");
            user = created.json;
          }
          const full = (await api(cfg, "GET", `/User/$${encodeURIComponent(user.id)}`, { auth: { token } })).json;
          if (full?.type !== "api" || full?.authMethod !== "ApiKey") throw new BootstrapError("the API user does not use API key authentication");
          if (!(full.rolesIds ?? []).includes(roleId)) {
            await api(cfg, "PUT", `/User/$${encodeURIComponent(user.id)}`, { auth: { token }, body: { rolesIds: [...(full.rolesIds ?? []), roleId] } });
          }
          if (full.isActive === false) throw new BootstrapError("the API user is deactivated");
          if (typeof full.apiKey !== "string" || full.apiKey.length < 16) throw new BootstrapError("EspoCRM returned no API key");
          if (saved?.apiKey !== full.apiKey || saved?.userId !== full.id) {
            await writeState(cfg, API_KEY_FILE, {
              schema: "sealed-crm-api-key/v1",
              userId: full.id,
              userName: cfg.apiUserName,
              header: "X-Api-Key",
              apiKey: full.apiKey,
              url: `$${cfg.origin}/api/v1/`,
            });
          }
          return full.apiKey;
        }

        export async function verifyApiKey(cfg, apiKey) {
          const res = await api(cfg, "GET", `/Account?$${listQuery({ maxSize: "1", select: "id" })}`, { auth: { apiKey }, allow: [401, 403] });
          if (res.status !== 200) throw new BootstrapError(`the API key cannot list accounts (HTTP $${res.status})`);
        }

        // siteUrl must be the public URL and every fixed switch present with its value; a renamed or
        // dropped setting fails too, so a release whose defaults changed fails loudly.
        export function checkSettings(cfg, settings, expected = SETTINGS_EXPECTED) {
          const missing = [];
          const wrong = [];
          for (const [key, value] of Object.entries(expected)) {
            if (!(key in settings)) missing.push(key);
            else if (settings[key] !== value) wrong.push(`$${key}=$${JSON.stringify(settings[key])}`);
          }
          if (settings.siteUrl === undefined) missing.push("siteUrl");
          else if (typeof settings.siteUrl !== "string" || trimSlash(settings.siteUrl) !== cfg.origin) wrong.push("siteUrl is not SEALED_PUBLIC_URL_CRM");
          if (missing.length > 0 || wrong.length > 0) {
            const parts = [];
            if (missing.length > 0) parts.push(`missing $${missing.join(", ")}`);
            if (wrong.length > 0) parts.push(`unexpected $${wrong.join(", ")}`);
            throw new BootstrapError(`settings: $${parts.join("; ")}`);
          }
        }

        export async function checkSystemSettings(cfg) {
          for (const [name, value] of Object.entries(SYSTEM_EXPECTED)) {
            const got = await configGet(cfg, name);
            if (got !== value) throw new BootstrapError(`config $${name} is $${got === undefined ? "not set" : JSON.stringify(got)}, expected $${value}`);
          }
          const siteUrl = await configGet(cfg, "siteUrl");
          if (siteUrl === undefined || trimSlash(siteUrl) !== cfg.origin) throw new BootstrapError("config siteUrl is not SEALED_PUBLIC_URL_CRM");
        }

        export async function run(env, { log = (m) => console.log(`[crm-bootstrap] $${m}`) } = {}) {
          try {
            const cfg = loadConfig(env);
            const done = await readState(cfg, DONE_FILE);
            const installed = await isInstalled(cfg);
            if (done) {
              if (!installed) throw new BootstrapError("done.json exists but EspoCRM is not installed");
              log("already bootstrapped: checking settings");
              await checkSystemSettings(cfg);
              const anonymous = await waitForServer(cfg, log);
              checkSettings(cfg, anonymous, { useWebSocket: false });
              log("settings ok");
              return 0;
            }
            if (!installed) await install(cfg, log);
            else log("EspoCRM is installed: resuming");
            await checkSystemSettings(cfg);
            await waitForServer(cfg, log);
            const { token } = await adminLogin(cfg);
            await checkSoleOwner(cfg, token);
            const roleId = await ensureRole(cfg, token);
            const apiKey = await ensureApiUser(cfg, token, roleId);
            await checkSoleOwner(cfg, token);
            await verifyApiKey(cfg, apiKey);
            const settings = (await api(cfg, "GET", "/Settings", { auth: { token } })).json ?? {};
            checkSettings(cfg, settings);
            const version = await configGet(cfg, "version");
            await writeState(cfg, DONE_FILE, { schema: "sealed-crm-bootstrap/v1", app: "espocrm", version, at: new Date().toISOString() }, 0o644);
            log("done: the crm route opens");
            return 0;
          } catch (err) {
            log(`failed: $${err instanceof BootstrapError ? err.message : "unexpected error"}`);
            if (!(err instanceof BootstrapError)) console.error(err?.stack ?? String(err));
            return 1;
          }
        }

        if (process.env.SEALED_BOOTSTRAP === "run") {
          process.exitCode = await run(process.env);
        }
      # <<< embedded
    environment:
      SEALED_BOOTSTRAP: "run"
      CRM_BASE_URL: "http://crm-server:8080"
      STATE_DIR: "/sealed-bootstrap"
      ADMIN_USERNAME: "admin"
      API_USER_NAME: "sealed-customer"
      HEALTH_TIMEOUT_S: "900"
    volumes:
      - crm-data:/var/www/html/data
      - crm-custom:/var/www/html/custom
      - crm-client-custom:/var/www/html/client/custom
      - crm-bootstrap:/sealed-bootstrap
    depends_on:
      crm-db:
        condition: service_healthy
    mem_limit: 256m

volumes:
  crm-data: {}
  crm-custom: {}
  crm-client-custom: {}
  crm-db-data: {}
  crm-bootstrap: {}
