schema: sealed-manifest/v1
id: crm
name: CRM (EspoCRM)
category: crm
description: >-
  EspoCRM, an open-source CRM for accounts, contacts, leads, opportunities, cases and
  activities, with a REST API and API keys. Runs on PostgreSQL. No self sign-up, update checks
  and the admin-panel news frame off, no extension uploads from the UI, no enterprise code.
upstream:
  repo: https://github.com/espocrm/espocrm
  version: 10.0.11
  license_spdx: AGPL-3.0-or-later
  source_url: https://github.com/espocrm/espocrm/tree/10.0.11
maintainer:
  name: Sealed
  payout_address: "${MAINTAINER_DEFAULT_ADDRESS}"
maintainer_share_bps: 2000
compose_fragment: compose.fragment.yaml
egress_policy: egress.yaml
primary_service: crm-server
images:
  # Built by images/espocrm/Dockerfile from Debian trixie packages (base
  # docker.io/library/debian:trixie-20261020-slim, index
  # sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad, packages from the
  # snapshot.debian.org date 20261027T000000Z) and the EspoCRM 10.0.11 release zip (sha256
  # cdd04f7efa52a59025ef824c75b06e0a84cf986724a8c5bc4b56fcd2ce8e0ab1). The digest is pinned
  # after the runtime image workflow builds it (D-028).
  - name: espocrm
    source: build:images/espocrm
    digest: sha256:ddc086fac0ed643bd6370179da9f521a573a5202de71df105482744afa29fec7
    platform: linux/amd64
    license_spdx: AGPL-3.0-or-later
  # Index digest (multi-arch). linux/amd64 manifest:
  # sha256:b95b87e93ceb7594715d5c71fb6e09f6fc878851ab537735d617325eb9ba8b1b.
  - name: postgres
    source: docker.io/library/postgres:16.15
    digest: sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
    platform: linux/amd64
    license_spdx: PostgreSQL
resources:
  cpu: 2
  # Sum of the fragment's mem_limit values: 1g + 512m + 1g + 256m = 2.75 GiB.
  memory_gb: 3
  disk_gb: 10
routes:
  - name: crm
    service: crm-server
    internal_port: 8080
    path_or_host: crm
    # Gate via forward_auth (D-044). EspoCRM never reads the standard Authorization header (the
    # image drops it), so the gate's Basic credentials and its cookie do not interfere with
    # EspoCRM's own login (Espo-Authorization, auth-token cookie) or API keys (X-Api-Key).
    auth: gate
healthcheck:
  service: crm-server
  http: /api/v1/Settings
  port: 8080
  start_period_s: 300
metering:
  unit: app_hour
  source: heartbeat
secrets:
  - name: PG_DATABASE_PASSWORD
    description: >-
      Password of the espocrm user of crm-db. EspoCRM reads it from
      data/config-internal-override.php, which sealed-espocrm writes on every start (hex, so it
      needs no quoting).
    generate: hex32
  - name: ADMIN_PASSWORD
    description: >-
      Password of the EspoCRM administrator "admin", created by the bootstrap job. Generated (24
      letters and digits) unless the customer sets one of 8 to 128 characters on one line.
      Changing it later in EspoCRM is fine; the bootstrap only needs it on the first start.
    generate: password
telemetry_off_env:
  ESPOCRM_CONFIG_USE_WEB_SOCKET: "false"
  ESPOCRM_CONFIG_ADMIN_NOTIFICATIONS: "false"
  ESPOCRM_CONFIG_ADMIN_NOTIFICATIONS_NEW_VERSION: "false"
  ESPOCRM_CONFIG_ADMIN_NOTIFICATIONS_NEW_EXTENSION_VERSION: "false"
  ESPOCRM_CONFIG_ADMIN_PANEL_IFRAME_DISABLED: "true"
  ESPOCRM_CONFIG_ADMIN_EXTENSION_UPLOAD: "false"
  ESPOCRM_CONFIG_ADMIN_UPGRADE_DISABLED: "true"
license_exclusions: []
bootstrap:
  service: crm-bootstrap
  done_file: crm-bootstrap/done.json
notes: >-
  D-049a: crm is EspoCRM, not Twenty. Twenty's official image compiles files under the
  Twenty.com Commercial License into the core, and a build without them is a fork (README,
  "Why not Twenty"). EspoCRM is AGPL-3.0-or-later in full: one module (Crm), no paid extensions
  in the release, and the image build fails if an application file lacks the AGPL header or a
  Composer package is outside the allowlist. The telemetry_off_env values are checked by
  sealed-espocrm, which writes the matching settings into data/config-override.php (version
  checks against s.espocrm.com, the admin-panel iframe from s.espocrm.com, WebSocket, extension
  uploads and UI upgrades all off). The release stays blocked until the runtime image workflow
  builds images/espocrm and its digest is pinned (D-028).
