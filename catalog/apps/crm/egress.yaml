version: 1
default_allow: []
customer_additions_allowed: true
notes: >-
  EspoCRM needs no outbound host to run. Calls found in the 10.0.11 source are off or fail
  closed here and show up as blocked counts: the version and extension checks against
  s.espocrm.com (adminNotifications off in data/config-override.php), the admin-panel iframe
  from s.espocrm.com (off; it would load in the admin's browser, outside the VM), and Google
  Maps, OAuth providers, reCAPTCHA and S3 storage, which run only when an admin configures them.
  Customers who later enable email add their IMAP and SMTP hosts, for example
  imap.example.com:993 and smtp.example.com:465 or :587. EspoCRM's IMAP and SMTP clients open
  raw TLS connections and do not use the HTTP proxy, so raw IMAP and SMTP need more than an
  allowlist entry. Webhooks and workflow HTTP calls go to the hosts the customer adds.
