# Apache for the Sealed crm image: EspoCRM with mod_php, run as www-data on port 8080.
# Started by sealed-espocrm with `apache2 -f /etc/apache2/sealed.conf -DFOREGROUND`; Debian's
# apache2.conf, sites and envvars are not used. Layout follows EspoCRM's production setup
# (document root public/, /client/ alias, .htaccess only under public/).

ServerRoot "/etc/apache2"
ServerName crm-server
Listen 8080
PidFile /tmp/apache2/apache2.pid
DefaultRuntimeDir /tmp/apache2
Mutex file:/tmp/apache2 default

LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule alias_module /usr/lib/apache2/modules/mod_alias.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so
LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
LoadModule remoteip_module /usr/lib/apache2/modules/mod_remoteip.so
LoadModule reqtimeout_module /usr/lib/apache2/modules/mod_reqtimeout.so
LoadModule php_module /usr/lib/apache2/modules/libphp8.4.so

<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 5
    MaxRequestWorkers 12
    MaxConnectionsPerChild 1000
</IfModule>

Timeout 180
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
LimitRequestBody 52428800

ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None
ErrorLog /proc/self/fd/2
LogLevel warn

TypesConfig /etc/mime.types
AddType application/javascript .js
AddType text/css .css

# A browser that passed the Sealed gate keeps sending its Basic credentials for user "sealed".
# EspoCRM reads a standard Authorization header as an EspoCRM login (PHP_AUTH_USER) before it
# looks at its auth-token cookie, so requests that carry only the cookie (attachments, images,
# downloads) would turn into a failed login as "sealed". EspoCRM's own clients never use this
# header: the web app sends Espo-Authorization and the auth-token cookie, API users send
# X-Api-Key or X-Hmac-Authorization. Drop it before anything reads it, whatever the gate does.
RequestHeader unset Authorization early
RequestHeader unset Proxy early

# Caddy (172.30.0.4 on the apps network) is the only proxy in front; use the client address it
# reports, so EspoCRM's per-address login limits apply per client and not to Caddy.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.30.0.4

<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot /var/www/html/public
DirectoryIndex index.php
Alias /client/ /var/www/html/client/

<Directory /var/www/html/public/>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory /var/www/html/client/>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

# Only PHP entry points under public/ run; client/ serves static files.
<Directory /var/www/html/client/>
    <FilesMatch "\.(php|phtml|phar)$">
        SetHandler none
        Require all denied
    </FilesMatch>
</Directory>
