; PHP settings for EspoCRM in the Sealed crm image (Apache mod_php and CLI). Values follow
; EspoCRM's recommended server configuration.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED
memory_limit = 256M
max_execution_time = 180
max_input_time = 180
post_max_size = 50M
upload_max_filesize = 50M
date.timezone = UTC
allow_url_include = Off
session.use_strict_mode = 1
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.validate_timestamps = 1
