# coding-agent compose fragment, OpenCode fallback (not in the default release; see README.md).
# Same service names as the OpenHands fragment, so it swaps in without changing routes.
#
# coding-agent-bootstrap starts as root to hand the workspace to uid 10001 (bootstrap/dropuid.py),
# then creates the gateway virtual key and writes it to /workspace/.sealed/llm-gateway-key
# (bootstrap/seed.py, key-file mode). coding-agent-server waits for it, exports the key as
# LITELLM_API_KEY and runs `opencode serve` with OPENCODE_CONFIG_CONTENT wired to llm-gateway.
services:
  coding-agent-bootstrap:
    image: "{{image:opencode}}"
    user: "0:0"
    entrypoint:
      - python3
      - -I
      - -c
      - |
        @@include bootstrap/dropuid.py@@
    command:
      - python3
      - -I
      - -c
      - |
        @@include bootstrap/seed.py@@
    x-sealed-secrets:
      - LITELLM_MASTER_KEY
    environment:
      SEALED_RUN_AS: "10001:10001"
      SEALED_OWNED_DIRS: /workspace,/workspace/project,/workspace/.sealed,/workspace/.opencode
      SEALED_BOOTSTRAP_MODE: key-file
      SEALED_GATEWAY_URL: http://llm-gateway:4000
      SEALED_LLM_KEY_ALIAS: coding-agent
      SEALED_LLM_KEY_MODELS: relay/*,local/*
      SEALED_MODEL_PRIMARY: relay/default
      SEALED_MODEL_FALLBACK: local/qwen3-4b
      SEALED_KEY_FILE: /workspace/.sealed/llm-gateway-key
      SEALED_DONE_FILE: /workspace/.sealed/bootstrap.done
      SEALED_WAIT_TIMEOUT_S: "900"
    volumes:
      - coding-agent-workspace:/workspace
    healthcheck:
      test: ["CMD", "python3", "-I", "-c", "import os, sys; sys.exit(0 if os.path.exists('/workspace/.sealed/bootstrap.done') else 1)"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 900s
    mem_limit: 256m
    stop_grace_period: 5s

  coding-agent-server:
    image: "{{image:opencode}}"
    user: "10001:10001"
    entrypoint:
      - python3
      - -I
      - -c
      - "import os, sys; os.environ['LITELLM_API_KEY'] = open('/workspace/.sealed/llm-gateway-key').read().strip(); os.execvp(sys.argv[1], sys.argv[1:])"
    command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096"]
    working_dir: /workspace/project
    x-sealed-secrets:
      - OPENCODE_SERVER_PASSWORD
    environment:
      # Must match the password gate's basic_auth user, so one Authorization header passes both.
      OPENCODE_SERVER_USERNAME: sealed
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_DISABLE_MODELS_FETCH: "1"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "1"
      OPENCODE_DISABLE_DEFAULT_PLUGINS: "1"
      OPENCODE_DISABLE_CLAUDE_CODE: "1"
      XDG_DATA_HOME: /workspace/.opencode/data
      XDG_CONFIG_HOME: /workspace/.opencode/config
      XDG_STATE_HOME: /workspace/.opencode/state
      XDG_CACHE_HOME: /tmp/opencode-cache
      OPENCODE_CONFIG_CONTENT: |
        {
          "autoupdate": false,
          "share": "disabled",
          "permission": "allow",
          "enabled_providers": ["litellm"],
          "model": "litellm/relay-default",
          "small_model": "litellm/local-qwen3-4b",
          "provider": {
            "litellm": {
              "npm": "@ai-sdk/openai-compatible",
              "name": "Sealed llm-gateway",
              "options": {"baseURL": "http://llm-gateway:4000/v1", "apiKey": "{env:LITELLM_API_KEY}"},
              "models": {
                "relay-default": {"id": "relay/default", "name": "Relay default (paid per token)", "limit": {"context": 128000, "output": 8192}},
                "local-qwen3-4b": {"id": "local/qwen3-4b", "name": "Local Qwen3 4B (stays in your VM)", "limit": {"context": 8192, "output": 2048}}
              }
            }
          }
        }
    depends_on:
      coding-agent-bootstrap:
        condition: service_healthy
    volumes:
      - coding-agent-workspace:/workspace
    tmpfs:
      - /tmp:size=1g,mode=1777
    healthcheck:
      test:
        - CMD
        - python3
        - -I
        - -c
        - "import base64, sys, urllib.request as u; p = open('/run/sealed/secrets/coding-agent/OPENCODE_SERVER_PASSWORD').read().rstrip('\\r\\n'); a = base64.b64encode(('sealed:' + p).encode()).decode(); r = u.Request('http://127.0.0.1:4096/global/health', headers={'Authorization': 'Basic ' + a}); sys.exit(0 if u.build_opener(u.ProxyHandler({})).open(r, timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 4g
    stop_grace_period: 30s

volumes:
  coding-agent-workspace: {}
