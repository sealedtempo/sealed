# GENERATED from compose.fragment.in.yaml by tools/build_fragment.py. Edit the template or bootstrap/*.py, then rerun the tool.
# coding-agent compose fragment, OpenCode fallback (not in the default release; see README.md).
# Same primary service and route as the OpenHands fragment, so it swaps in without changing routes.
#
# coding-agent-server runs as uid 10001 from the start: sealed-agent creates the workspace
# volume with its x-sealed-owner (integration brief item 11). bootstrap/prepdirs.py creates the
# workspace directories and changes to /workspace/project, then bootstrap/authproxy.py starts
# OpenCode on loopback (127.0.0.1:4097, Basic auth with its own generated password) and serves
# the API on :4096 to callers that send the session key (X-Session-API-Key or Authorization:
# Bearer). The proxy drops client Authorization headers and the gate's sealed_gate cookie, so
# neither the gate password nor the gate cookie reaches the agent. OpenCode reads its gateway
# key from LLM_GATEWAY_KEY ({env:LLM_GATEWAY_KEY}); this app holds no gateway master key.
services:
  coding-agent-server:
    image: "{{image:opencode}}"
    user: "10001:10001"
    entrypoint:
      - /usr/bin/python3
      - -I
      - -c
      - |
        """Create the coding-agent data directories as the runtime user, then exec the command.

        Nothing here runs as root. The workspace volume already belongs to the runtime user when the
        container starts: the fragment declares x-sealed-owner on it, and sealed-agent creates
        /mnt/sealed-data/coding-agent/<volume> with that owner before it releases the ready gate
        (integration brief item 11). This creates the directories in SEALED_OWNED_DIRS that do not exist
        yet (a symlink planted there is removed, never followed), refuses directories owned by another
        user (so a missing x-sealed-owner fails loudly), sets no_new_privs (the composer also sets
        no-new-privileges; this checks it), changes to SEALED_WORKDIR when set, and execs argv. Embedded
        verbatim in the compose fragment.
        """
        import ctypes
        import os
        import pwd
        import stat
        import sys

        PR_SET_NO_NEW_PRIVS = 38
        PR_GET_NO_NEW_PRIVS = 39


        class PrepError(Exception):
            pass


        def parse_ids(spec):
            try:
                uid_text, gid_text = spec.split(":", 1)
                uid, gid = int(uid_text), int(gid_text)
            except ValueError:
                raise PrepError("SEALED_RUN_AS must be uid:gid, got " + repr(spec))
            if uid <= 0 or gid <= 0:
                raise PrepError("SEALED_RUN_AS must name a non-root uid and gid")
            return uid, gid


        def owned_dirs(value):
            dirs = [d.strip() for d in value.split(",") if d.strip()]
            for d in dirs:
                if not os.path.isabs(d) or ".." in d.split("/"):
                    raise PrepError("SEALED_OWNED_DIRS entries must be absolute paths: " + repr(d))
            return dirs


        def prepare(dirs, uid):
            """Create missing directories as the current user; every directory must be ours."""
            for path in dirs:
                try:
                    st = os.lstat(path)
                except FileNotFoundError:
                    st = None
                if st is not None and stat.S_ISLNK(st.st_mode):
                    os.unlink(path)
                    st = None
                if st is not None and not stat.S_ISDIR(st.st_mode):
                    raise PrepError(path + " exists and is not a directory")
                if st is None:
                    os.mkdir(path, 0o755)
                    st = os.lstat(path)
                if st.st_uid != uid:
                    raise PrepError(path + " is owned by uid " + str(st.st_uid) + ", not " + str(uid)
                                    + " (is x-sealed-owner applied to the volume?)")


        def set_no_new_privs():
            """prctl(PR_SET_NO_NEW_PRIVS, 1): exec can no longer grant privileges (setuid, file caps)."""
            if not sys.platform.startswith("linux"):
                raise PrepError("no_new_privs needs Linux")
            libc = ctypes.CDLL(None, use_errno=True)
            if libc.prctl(PR_SET_NO_NEW_PRIVS, 1, 0, 0, 0) != 0:
                raise PrepError("prctl(PR_SET_NO_NEW_PRIVS) failed: errno " + str(ctypes.get_errno()))
            if libc.prctl(PR_GET_NO_NEW_PRIVS, 0, 0, 0, 0) != 1:
                raise PrepError("no_new_privs did not take effect")


        def home_of(uid):
            try:
                return pwd.getpwuid(uid).pw_dir
            except KeyError:
                return "/tmp"


        def workdir(env, dirs):
            path = env.get("SEALED_WORKDIR", "")
            if not path:
                return None
            if path not in dirs:
                raise PrepError("SEALED_WORKDIR must be one of SEALED_OWNED_DIRS, got " + repr(path))
            return path


        def main(argv=None, env=None, execvp=os.execvp, getuid=os.getuid, getgid=os.getgid,
                 no_new_privs=set_no_new_privs, chdir=os.chdir):
            argv = list(sys.argv if argv is None else argv)
            env = os.environ if env is None else env
            if len(argv) < 2:
                print("prepdirs: usage: prepdirs <command> [args...]", file=sys.stderr)
                return 2
            try:
                uid, gid = parse_ids(env.get("SEALED_RUN_AS", "10001:10001"))
                dirs = owned_dirs(env.get("SEALED_OWNED_DIRS", ""))
                target = workdir(env, dirs)
                current = (getuid(), getgid())
                if current[0] == 0:
                    raise PrepError("runs as root; the fragment must set user to " + str(uid) + ":" + str(gid))
                if current != (uid, gid):
                    raise PrepError("started as " + str(current[0]) + ":" + str(current[1]) + "; expected "
                                    + str(uid) + ":" + str(gid))
                prepare(dirs, uid)
                no_new_privs()
                if target:
                    chdir(target)
            except (PrepError, OSError, AttributeError) as err:
                print("prepdirs: " + str(err), file=sys.stderr)
                return 1
            env["HOME"] = home_of(uid)
            sys.stderr.flush()
            execvp(argv[1], argv[1:])
            return 0


        if __name__ == "__main__":
            sys.exit(main())
    command:
      - /usr/bin/python3
      - -I
      - -c
      - |
        """Session-key gate in front of OpenCode in the same container (stdlib only; embedded verbatim
        in the OpenCode fallback fragment).

        The code route sits behind Sealed's gate (Caddy forward_auth to sealed-agent): a client sends
        Basic auth with user sealed and the gate password once, receives the sealed_gate cookie, and
        then sends the cookie. With the cookie, the client's own Authorization header passes the gate
        untouched. Neither the gate password nor the gate cookie may reach the agent, because the gate
        protects every app UI. This proxy runs OpenCode on loopback (argv after --) and serves its API
        on the container port:
        - every request needs the session key CODE_SESSION_API_KEY, as X-Session-API-Key: <key> or
          Authorization: Bearer <key>, except GET or HEAD of /global/health (healthchecks);
        - requests reach OpenCode with Authorization: Basic <OPENCODE_SERVER_USERNAME>:
          <OPENCODE_SERVER_PASSWORD>, a password generated for OpenCode alone; any client
          Authorization header (a Bearer session key, or gate Basic credentials a browser keeps
          sending) is dropped, and so is the sealed_gate cookie;
        - /global/upgrade (self-update) is refused, and so are WebSocket upgrades;
        - responses stream, so Server-Sent Events (/event) work.
        CODE_SESSION_API_KEY is removed from OpenCode's environment. Paths and bodies are never logged.

          authproxy.py --listen 0.0.0.0:4096 --upstream 127.0.0.1:4097 -- opencode serve --port 4097
        """
        import base64
        import hmac
        import http.client
        import http.server
        import os
        import signal
        import subprocess
        import sys
        import threading

        SESSION_KEY_ENV = "CODE_SESSION_API_KEY"
        HOP_BY_HOP = {"connection", "keep-alive", "proxy-authenticate", "proxy-authorization", "proxy-connection",
                      "te", "trailer", "trailers", "transfer-encoding", "upgrade"}
        DROP_FROM_CLIENT = HOP_BY_HOP | {"authorization", "x-session-api-key", "host", "content-length", "cookie"}
        GATE_COOKIE = "sealed_gate"
        PUBLIC = {("GET", "/global/health"), ("HEAD", "/global/health")}
        DENIED_PREFIXES = ("/global/upgrade",)
        MAX_BODY = 64 * 1024 * 1024
        MIN_SECRET_LEN = 16


        class ProxyError(Exception):
            def __init__(self, status, message):
                super().__init__(message)
                self.status = status


        def log(message):
            print("authproxy: " + message, file=sys.stderr, flush=True)


        def without_gate_cookie(values):
            """The Cookie header values joined, minus the gate's sealed_gate cookie ("" if none is left)."""
            kept = []
            for value in values:
                for part in value.split(";"):
                    part = part.strip()
                    if part and part.split("=", 1)[0].strip() != GATE_COOKIE:
                        kept.append(part)
            return "; ".join(kept)


        def host_port(text):
            host, sep, port = text.rpartition(":")
            if not sep or not host or not port.isdigit():
                raise ValueError("expected host:port, got " + repr(text))
            return host, int(port)


        def parse_args(argv):
            if "--" not in argv:
                raise ValueError("usage: authproxy.py --listen HOST:PORT --upstream HOST:PORT -- <opencode command>")
            sep = argv.index("--")
            flags, child = argv[:sep], argv[sep + 1:]
            values = {"--listen": "0.0.0.0:4096", "--upstream": "127.0.0.1:4097"}
            i = 0
            while i < len(flags):
                if flags[i] not in values or i + 1 >= len(flags):
                    raise ValueError("unknown or incomplete flag " + repr(flags[i]))
                values[flags[i]] = flags[i + 1]
                i += 2
            upstream = host_port(values["--upstream"])
            if upstream[0] not in ("127.0.0.1", "localhost", "::1"):
                raise ValueError("--upstream must be loopback, so OpenCode is never reachable directly")
            if not child:
                raise ValueError("missing OpenCode command after --")
            return host_port(values["--listen"]), upstream, child


        class Settings:
            def __init__(self, upstream, session_key, user, password):
                if len(session_key) < MIN_SECRET_LEN:
                    raise ValueError(SESSION_KEY_ENV + " is missing or shorter than 16 characters")
                if len(password) < MIN_SECRET_LEN:
                    raise ValueError("OPENCODE_SERVER_PASSWORD is missing or shorter than 16 characters")
                self.upstream = upstream
                self.session_key = session_key.encode("utf-8")
                token = base64.b64encode((user + ":" + password).encode("utf-8")).decode("ascii")
                self.upstream_auth = "Basic " + token

            @classmethod
            def from_env(cls, env, upstream):
                return cls(upstream, (env.get(SESSION_KEY_ENV) or "").strip(),
                           env.get("OPENCODE_SERVER_USERNAME") or "opencode",
                           (env.get("OPENCODE_SERVER_PASSWORD") or "").strip())


        def make_handler(settings):
            class Handler(http.server.BaseHTTPRequestHandler):
                protocol_version = "HTTP/1.1"
                server_version = "sealed-authproxy"
                sys_version = ""

                def log_message(self, *args):
                    pass

                def reply(self, status, text):
                    body = (text + "\n").encode("utf-8")
                    self.send_response(status)
                    self.send_header("Content-Type", "text/plain; charset=utf-8")
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    if self.command != "HEAD":
                        self.wfile.write(body)

                def authorized(self, path):
                    if (self.command, path) in PUBLIC:
                        return True
                    candidates = [self.headers.get("X-Session-API-Key") or ""]
                    scheme, _, token = (self.headers.get("Authorization") or "").partition(" ")
                    if scheme.lower() == "bearer":
                        candidates.append(token.strip())
                    ok = False
                    for supplied in candidates:
                        ok = hmac.compare_digest(supplied.encode("utf-8"), settings.session_key) or ok
                    return ok

                def read_body(self):
                    encoding = (self.headers.get("Transfer-Encoding") or "").strip().lower()
                    if encoding:
                        if encoding != "chunked":
                            raise ProxyError(501, "unsupported transfer encoding")
                        return self.read_chunked()
                    length = self.headers.get("Content-Length")
                    if length is None:
                        return None
                    try:
                        size = int(length)
                    except ValueError:
                        raise ProxyError(400, "bad Content-Length")
                    if size < 0 or size > MAX_BODY:
                        raise ProxyError(413, "request body too large")
                    return self.rfile.read(size)

                def read_chunked(self):
                    chunks, total = [], 0
                    while True:
                        line = self.rfile.readline(1024)
                        try:
                            size = int(line.split(b";")[0].strip(), 16)
                        except ValueError:
                            raise ProxyError(400, "bad chunked body")
                        if size == 0:
                            while self.rfile.readline(1024) not in (b"\r\n", b"\n", b""):
                                pass
                            return b"".join(chunks)
                        total += size
                        if total > MAX_BODY:
                            raise ProxyError(413, "request body too large")
                        chunks.append(self.rfile.read(size))
                        self.rfile.readline(1024)

                def forward_headers(self, body):
                    named = {t.strip().lower() for t in (self.headers.get("Connection") or "").split(",")}
                    headers = {k: v for k, v in self.headers.items() if k.lower() not in DROP_FROM_CLIENT | named}
                    cookies = without_gate_cookie(self.headers.get_all("Cookie") or [])
                    if cookies:
                        headers["Cookie"] = cookies
                    headers["Host"] = settings.upstream[0] + ":" + str(settings.upstream[1])
                    headers["Authorization"] = settings.upstream_auth
                    if body is not None:
                        headers["Content-Length"] = str(len(body))
                    return headers

                def handle_any(self):
                    if not self.path.startswith("/"):
                        self.close_connection = True
                        return self.reply(400, "bad request target")
                    path = self.path.split("?", 1)[0]
                    if not self.authorized(path):
                        return self.reply(401, "missing or wrong session key (X-Session-API-Key or Authorization: Bearer)")
                    if path.startswith(DENIED_PREFIXES):
                        return self.reply(403, "not allowed through the Sealed code route")
                    if self.headers.get("Upgrade"):
                        self.close_connection = True
                        return self.reply(501, "connection upgrades are not proxied")
                    try:
                        body = self.read_body()
                    except ProxyError as err:
                        self.close_connection = True
                        return self.reply(err.status, str(err))
                    conn = http.client.HTTPConnection(settings.upstream[0], settings.upstream[1])
                    try:
                        try:
                            conn.request(self.command, self.path, body=body, headers=self.forward_headers(body))
                            response = conn.getresponse()
                        except OSError:
                            self.close_connection = True
                            return self.reply(502, "OpenCode is not reachable")
                        self.relay(response)
                    except OSError:
                        self.close_connection = True  # client went away mid-stream
                    finally:
                        conn.close()

                def relay(self, response):
                    length = response.getheader("Content-Length")
                    no_body = self.command == "HEAD" or response.status in (204, 304) or response.status < 200
                    self.send_response_only(response.status, response.reason)
                    for key, value in response.getheaders():
                        if key.lower() not in HOP_BY_HOP and key.lower() != "content-length":
                            self.send_header(key, value)
                    if no_body or length is not None:
                        if length is not None:
                            self.send_header("Content-Length", length)
                        self.end_headers()
                        while not no_body:
                            data = response.read(65536)
                            if not data:
                                break
                            self.wfile.write(data)
                    else:
                        self.send_header("Transfer-Encoding", "chunked")
                        self.end_headers()
                        while True:
                            data = response.read1(65536)
                            if not data:
                                break
                            self.wfile.write(b"%x\r\n" % len(data) + data + b"\r\n")
                            self.wfile.flush()
                        self.wfile.write(b"0\r\n\r\n")
                    self.wfile.flush()

                do_GET = do_HEAD = do_POST = do_PUT = do_PATCH = do_DELETE = do_OPTIONS = handle_any

            return Handler


        def make_server(listen, settings):
            server = http.server.ThreadingHTTPServer(listen, make_handler(settings))
            server.daemon_threads = True
            return server


        def main(argv=None, env=None, popen=subprocess.Popen):
            argv = list(sys.argv[1:] if argv is None else argv)
            env = dict(os.environ if env is None else env)
            try:
                listen, upstream, child = parse_args(argv)
                settings = Settings.from_env(env, upstream)
                server = make_server(listen, settings)
            except (ValueError, OSError) as err:
                log("error: " + str(err))
                return 2
            child_env = {k: v for k, v in env.items() if k != SESSION_KEY_ENV}
            try:
                proc = popen(child, env=child_env)
            except OSError as err:
                server.server_close()
                log("error: cannot start " + child[0] + ": " + str(err))
                return 1
            for sig in (signal.SIGTERM, signal.SIGINT):
                signal.signal(sig, lambda signum, _frame: proc.send_signal(signum))
            host, port = server.server_address[:2]
            log("listening on " + host + ":" + str(port) + ", OpenCode on " + upstream[0] + ":" + str(upstream[1]))
            threading.Thread(target=server.serve_forever, daemon=True).start()
            code = proc.wait()
            server.shutdown()
            server.server_close()
            return code if code >= 0 else 128 - code


        if __name__ == "__main__":
            sys.exit(main())
      - "--listen"
      - "0.0.0.0:4096"
      - "--upstream"
      - "127.0.0.1:4097"
      - "--"
      - opencode
      - serve
      - "--hostname"
      - "127.0.0.1"
      - "--port"
      - "4097"
    # The volume root, which exists and belongs to 10001; prepdirs.py moves to SEALED_WORKDIR.
    working_dir: /workspace
    x-sealed-secrets:
      - LLM_GATEWAY_KEY
      - CODE_SESSION_API_KEY
      - OPENCODE_SERVER_PASSWORD
    environment:
      SEALED_RUN_AS: "10001:10001"
      SEALED_OWNED_DIRS: /workspace,/workspace/project,/workspace/.opencode
      SEALED_WORKDIR: /workspace/project
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_DISABLE_MODELS_FETCH: "1"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "1"
      OPENCODE_DISABLE_DEFAULT_PLUGINS: "1"
      OPENCODE_DISABLE_CLAUDE_CODE: "1"
      XDG_DATA_HOME: /workspace/.opencode/data
      XDG_CONFIG_HOME: /workspace/.opencode/config
      XDG_STATE_HOME: /workspace/.opencode/state
      XDG_CACHE_HOME: /tmp/opencode-cache
      OPENCODE_CONFIG_CONTENT: |
        {
          "autoupdate": false,
          "share": "disabled",
          "permission": "allow",
          "enabled_providers": ["litellm"],
          "model": "litellm/relay-default",
          "small_model": "litellm/local-qwen3-4b",
          "provider": {
            "litellm": {
              "npm": "@ai-sdk/openai-compatible",
              "name": "Sealed llm-gateway",
              "options": {"baseURL": "http://llm-gateway:4000/v1", "apiKey": "{env:LLM_GATEWAY_KEY}"},
              "models": {
                "relay-default": {"id": "relay/default", "name": "Relay default (paid per token)", "limit": {"context": 128000, "output": 8192}},
                "local-qwen3-4b": {"id": "local/qwen3-4b", "name": "Local Qwen3 4B (stays in your VM)", "limit": {"context": 8192, "output": 2048}}
              }
            }
          }
        }
    volumes:
      - coding-agent-workspace:/workspace
    tmpfs:
      - /tmp:size=1g,mode=1777
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -I
        - -c
        - "import sys, urllib.request as u; o = u.build_opener(u.ProxyHandler({})); sys.exit(0 if o.open('http://127.0.0.1:4096/global/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 4g
    stop_grace_period: 30s

volumes:
  coding-agent-workspace:
    x-sealed-owner: "10001:10001"
