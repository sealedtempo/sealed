# GENERATED from compose.fragment.in.yaml by tools/build_fragment.py. Edit the template or bootstrap/*.py, then rerun the tool.
# coding-agent compose fragment (INTERFACES section 14): OpenHands agent-server, local runtime.
# The composer adds networks, fixed IPs, DNS, proxy env (NO_PROXY covers llm-gateway),
# telemetry_off_env, envexec, secret mounts, restart and logging.
#
# coding-agent-server starts as root only to hand the workspace volume to uid 10001
# (bootstrap/dropuid.py, embedded below), then runs agent-server as 10001 with no_new_privs.
# coding-agent-bootstrap (manifest bootstrap job) checks that llm-gateway accepts this app's
# virtual key LLM_GATEWAY_KEY and seeds the agent's LLM settings (bootstrap/seed.py, embedded
# below), then idles. It starts as root only to hand its own state volume to uid 10003
# (dropuid.py again); that volume holds the done file and is not mounted into the agent's
# container, so the agent cannot forge or delete it. No service of this app holds the gateway
# master key (llm-gateway provisions LLM_GATEWAY_KEY).
services:
  coding-agent-server:
    image: "{{image:openhands-agent-server}}"
    user: "0:0"
    entrypoint:
      - /usr/local/bin/python3
      - -I
      - -c
      - |
        """Prepare the coding-agent data directories as root, drop to the runtime user, exec the command.

        The composer turns named volumes into bind mounts that start out owned by root, while the
        agent runs as uid 10001. This runs first (as root, after envexec), creates the directories
        in SEALED_OWNED_DIRS, hands them to SEALED_RUN_AS, drops every privilege, sets
        no_new_privs (so setuid binaries in the image cannot regain root) and execs argv.
        Symlinks planted inside the volume are removed, never followed. Embedded verbatim in the
        compose fragment.
        """
        import ctypes
        import os
        import pwd
        import stat
        import sys

        PR_SET_NO_NEW_PRIVS = 38
        PR_GET_NO_NEW_PRIVS = 39


        class DropError(Exception):
            pass


        def parse_ids(spec):
            try:
                uid_text, gid_text = spec.split(":", 1)
                uid, gid = int(uid_text), int(gid_text)
            except ValueError:
                raise DropError("SEALED_RUN_AS must be uid:gid, got " + repr(spec))
            if uid <= 0 or gid <= 0:
                raise DropError("SEALED_RUN_AS must name a non-root uid and gid")
            return uid, gid


        def owned_dirs(value):
            dirs = [d.strip() for d in value.split(",") if d.strip()]
            for d in dirs:
                if not os.path.isabs(d) or ".." in d.split("/"):
                    raise DropError("SEALED_OWNED_DIRS entries must be absolute paths: " + repr(d))
            return dirs


        def prepare(dirs, uid, gid):
            for path in dirs:
                try:
                    st = os.lstat(path)
                except FileNotFoundError:
                    st = None
                if st is not None and stat.S_ISLNK(st.st_mode):
                    os.unlink(path)
                    st = None
                if st is not None and not stat.S_ISDIR(st.st_mode):
                    raise DropError(path + " exists and is not a directory")
                if st is None:
                    os.mkdir(path, 0o755)
                os.chown(path, uid, gid, follow_symlinks=False)


        def drop(uid, gid):
            os.setgroups([])
            os.setgid(gid)
            os.setuid(uid)
            if os.getuid() != uid or os.geteuid() != uid or os.getgid() != gid:
                raise DropError("privilege drop did not take effect")
            try:
                os.setuid(0)
            except PermissionError:
                return
            raise DropError("could regain root after the drop")


        def set_no_new_privs():
            """prctl(PR_SET_NO_NEW_PRIVS, 1): exec can no longer grant privileges (setuid, file caps)."""
            if not sys.platform.startswith("linux"):
                raise DropError("no_new_privs needs Linux")
            libc = ctypes.CDLL(None, use_errno=True)
            if libc.prctl(PR_SET_NO_NEW_PRIVS, 1, 0, 0, 0) != 0:
                raise DropError("prctl(PR_SET_NO_NEW_PRIVS) failed: errno " + str(ctypes.get_errno()))
            if libc.prctl(PR_GET_NO_NEW_PRIVS, 0, 0, 0, 0) != 1:
                raise DropError("no_new_privs did not take effect")


        def home_of(uid):
            try:
                return pwd.getpwuid(uid).pw_dir
            except KeyError:
                return "/tmp"


        def main(argv=None, env=None, execvp=os.execvp, getuid=os.getuid, no_new_privs=set_no_new_privs):
            argv = list(sys.argv if argv is None else argv)
            env = os.environ if env is None else env
            if len(argv) < 2:
                print("dropuid: usage: dropuid <command> [args...]", file=sys.stderr)
                return 2
            try:
                uid, gid = parse_ids(env.get("SEALED_RUN_AS", "10001:10001"))
                dirs = owned_dirs(env.get("SEALED_OWNED_DIRS", ""))
                current = getuid()
                if current == 0:
                    prepare(dirs, uid, gid)
                    drop(uid, gid)
                elif current != uid:
                    raise DropError("started as uid " + str(current) + "; expected root or " + str(uid))
                no_new_privs()
            except (DropError, OSError, AttributeError) as err:
                print("dropuid: " + str(err), file=sys.stderr)
                return 1
            env["HOME"] = home_of(uid)
            sys.stderr.flush()
            execvp(argv[1], argv[1:])
            return 0


        if __name__ == "__main__":
            sys.exit(main())
    command: ["tini", "--", "/usr/local/bin/openhands-agent-server", "--host", "0.0.0.0", "--port", "8000"]
    x-sealed-secrets:
      - OH_SESSION_API_KEYS_0
      - OH_SECRET_KEY
    environment:
      SEALED_RUN_AS: "10001:10001"
      SEALED_OWNED_DIRS: /workspace,/workspace/project,/workspace/conversations,/workspace/bash_events,/workspace/.openhands
      OH_CONVERSATION_RUNTIME: local
      OH_CONVERSATION_RUNTIME_SELECTABLE: "false"
      OH_ENABLE_VSCODE: "false"
      OH_ENABLE_BROWSER: "false"
      OH_PRELOAD_TOOLS: "false"
      OH_WORKSPACE_PATH: /workspace/project
      OH_CONVERSATIONS_PATH: /workspace/conversations
      OH_BASH_EVENTS_DIR: /workspace/bash_events
      OH_PERSISTENCE_DIR: /workspace/.openhands
      OH_MAX_CONCURRENT_RUNS: "4"
      LOG_JSON: "true"
      LOG_LEVEL: INFO
      TMUX_TMPDIR: /tmp/oh-tmux
    volumes:
      - coding-agent-workspace:/workspace
    tmpfs:
      - /tmp:size=1g,mode=1777
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/python3
        - -I
        - -c
        - "import sys, urllib.request as u; o = u.build_opener(u.ProxyHandler({})); sys.exit(0 if o.open('http://127.0.0.1:8000/ready', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 4g
    stop_grace_period: 30s

