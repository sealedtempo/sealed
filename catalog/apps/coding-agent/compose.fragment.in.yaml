# coding-agent compose fragment (INTERFACES section 14): OpenHands agent-server, local runtime.
# The composer adds networks, fixed IPs, DNS, proxy env (NO_PROXY covers llm-gateway),
# telemetry_off_env, envexec, per-service secret mounts, restart and logging.
#
# Nothing here starts as root. sealed-agent creates each volume with its x-sealed-owner
# (integration brief item 11) before the ready gate opens, so coding-agent-server runs as
# uid 10001 from the start: bootstrap/prepdirs.py (embedded below) creates the workspace
# directories, checks no_new_privs and execs agent-server. coding-agent-bootstrap (manifest
# bootstrap job, restart on-failure) runs as uid 10003, seeds the agent's LLM settings with
# this app's virtual key LLM_GATEWAY_KEY (bootstrap/seed.py, embedded below), writes
# coding-agent-bootstrap/done and exits. It talks only to coding-agent-server: it is on this
# app's network alone, and only coding-agent-server (the primary service) also joins the shared
# apps network where llm-gateway is (D-041). Its volume is not mounted into
# the agent's container, so the agent cannot forge or delete the done file. Each service sees
# only the secret files it lists; no service of this app holds the gateway master key
# (llm-gateway provisions LLM_GATEWAY_KEY, which refers to its APP_KEY_CODING_AGENT).
services:
  coding-agent-server:
    image: "{{image:openhands-agent-server}}"
    user: "10001:10001"
    entrypoint:
      - /usr/local/bin/python3
      - -I
      - -c
      - |
        @@include bootstrap/prepdirs.py@@
    command: ["tini", "--", "/usr/local/bin/openhands-agent-server", "--host", "0.0.0.0", "--port", "8000"]
    x-sealed-secrets:
      - OH_SESSION_API_KEYS_0
      - OH_SECRET_KEY
    environment:
      SEALED_RUN_AS: "10001:10001"
      SEALED_OWNED_DIRS: /workspace,/workspace/project,/workspace/conversations,/workspace/bash_events,/workspace/.openhands
      OH_CONVERSATION_RUNTIME: local
      OH_CONVERSATION_RUNTIME_SELECTABLE: "false"
      OH_ENABLE_VSCODE: "false"
      OH_ENABLE_BROWSER: "false"
      OH_PRELOAD_TOOLS: "false"
      OH_WORKSPACE_PATH: /workspace/project
      OH_CONVERSATIONS_PATH: /workspace/conversations
      OH_BASH_EVENTS_DIR: /workspace/bash_events
      OH_PERSISTENCE_DIR: /workspace/.openhands
      OH_MAX_CONCURRENT_RUNS: "4"
      LOG_JSON: "true"
      LOG_LEVEL: INFO
      TMUX_TMPDIR: /tmp/oh-tmux
    volumes:
      - coding-agent-workspace:/workspace
    tmpfs:
      - /tmp:size=1g,mode=1777
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/python3
        - -I
        - -c
        - "import sys, urllib.request as u; o = u.build_opener(u.ProxyHandler({})); sys.exit(0 if o.open('http://127.0.0.1:8000/ready', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 4g
    stop_grace_period: 30s

  coding-agent-bootstrap:
    image: "{{image:openhands-agent-server}}"
    user: "10003:10003"
    entrypoint:
      - /usr/local/bin/python3
      - -I
      - -c
      - |
        @@include bootstrap/seed.py@@
    read_only: true
    x-sealed-secrets:
      - LLM_GATEWAY_KEY
      - OH_SESSION_API_KEYS_0
    environment:
      SEALED_GATEWAY_URL: http://llm-gateway:4000
      SEALED_AGENT_SERVER_URL: http://coding-agent-server:8000
      SEALED_MODEL_DEFAULT: relay/default
      SEALED_DONE_FILE: /var/lib/sealed-bootstrap/done
      SEALED_WAIT_TIMEOUT_S: "900"
    depends_on:
      coding-agent-server:
        condition: service_healthy
    volumes:
      - coding-agent-bootstrap:/var/lib/sealed-bootstrap
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    stop_grace_period: 5s

volumes:
  coding-agent-workspace:
    x-sealed-owner: "10001:10001"
  coding-agent-bootstrap:
    x-sealed-owner: "10003:10003"
