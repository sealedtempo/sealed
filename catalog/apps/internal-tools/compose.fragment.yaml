# internal-tools: ToolJet CE v3.20.251-lts (derived image without Redis server and Oracle
# Instant Client), PostgREST 12.2.12 for ToolJet Database, PostgreSQL 16.15, Valkey 9.0.7, and a
# one-shot bootstrap. Follows deploy/docker/docker-compose.yaml at v3.20.251-lts (ToolJet plus a
# separate PostgREST) with the bundled Redis replaced by Valkey (D-020) and Postgres added.
# Rules: docs/INTERFACES.md section 14. Every "$" that the shell or Node must see is written "$$"
# so that compose interpolation leaves it alone. Telemetry switches come from the manifest's
# telemetry_off_env, which the composer adds to every service.
services:
  internal-tools-server:
    image: "{{image:tooljet}}"
    user: "1000:1000"
    x-sealed-secrets: [LOCKBOX_MASTER_KEY, SECRET_KEY_BASE, PGRST_JWT_SECRET, PGPASSWORD, SAMPLE_DB_PASSWORD, REDIS_PASSWORD]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        : "$${SEALED_PUBLIC_URL_TOOLS:?the composer must set SEALED_PUBLIC_URL_TOOLS}"
        export TOOLJET_HOST="$$SEALED_PUBLIC_URL_TOOLS"
        export PG_PASS="$$PGPASSWORD" TOOLJET_DB_PASS="$$PGPASSWORD" SAMPLE_PG_DB_PASS="$$SAMPLE_DB_PASSWORD"
        # libpq and node-postgres fall back to PGPASSWORD; keep the superuser password away
        # from data sources that users create.
        unset PGPASSWORD SAMPLE_DB_PASSWORD
        exec /app/server/sealed-entrypoint.sh "$$@"
      - internal-tools-server
    command: ["node", "dist/src/main"]
    environment:
      TOOLJET_EDITION: "ce"
      NODE_ENV: "production"
      SERVE_CLIENT: "true"
      PORT: "3000"
      LISTEN_ADDR: "0.0.0.0"
      PG_HOST: "internal-tools-db"
      PG_PORT: "5432"
      PG_USER: "postgres"
      PG_DB: "tooljet_production"
      TOOLJET_DB: "tooljet_db"
      TOOLJET_DB_HOST: "internal-tools-db"
      TOOLJET_DB_PORT: "5432"
      TOOLJET_DB_USER: "postgres"
      # The sample data source every workspace gets uses this role, not the superuser.
      SAMPLE_PG_DB_HOST: "internal-tools-db"
      SAMPLE_PG_DB_PORT: "5432"
      SAMPLE_PG_DB_USER: "tooljet_sample"
      PGRST_HOST: "http://internal-tools-postgrest:3000"
      REDIS_HOST: "internal-tools-valkey"
      REDIS_PORT: "6379"
      WORKER: "true"
      DISABLE_SIGNUPS: "true"
      SSO_DISABLE_SIGNUPS: "true"
      ENABLE_MULTIPLAYER_EDITING: "true"
      USER_SESSION_EXPIRY: "2880"
    depends_on:
      internal-tools-db:
        condition: service_healthy
      internal-tools-valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      # First boot creates the databases and runs several hundred migrations.
      start_period: 300s
    stop_grace_period: 30s
    mem_limit: 4g

  internal-tools-postgrest:
    image: "{{image:postgrest}}"
    x-sealed-secrets: [PGPASSWORD, PGRST_JWT_SECRET]
    entrypoint: ["/bin/postgrest"]
    environment:
      # libpq reads the password from PGPASSWORD, so the URI carries none.
      PGRST_DB_URI: "postgres://postgres@internal-tools-db:5432/tooljet_db"
      PGRST_DB_PRE_CONFIG: "postgrest.pre_config"
      PGRST_SERVER_PORT: "3000"
      PGRST_LOG_LEVEL: "info"
    depends_on:
      # The server creates tooljet_db and postgrest.pre_config during its migrations.
      internal-tools-server:
        condition: service_healthy
    read_only: true
    stop_grace_period: 10s
    mem_limit: 256m

  internal-tools-db:
    image: "{{image:postgres}}"
    x-sealed-secrets: [PGPASSWORD, SAMPLE_DB_PASSWORD]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        export POSTGRES_PASSWORD="$$PGPASSWORD"
        unset PGPASSWORD
        # Runs only when the data directory is first initialised. The role owns the sample
        # database ToolJet creates; it is not a superuser.
        cat > /docker-entrypoint-initdb.d/10-sealed-sample-role.sh <<'EOF'
        #!/bin/sh
        set -eu
        psql -v ON_ERROR_STOP=1 -v pw="$$SAMPLE_DB_PASSWORD" --username "$$POSTGRES_USER" --dbname postgres <<'SQL'
        CREATE ROLE tooljet_sample LOGIN CREATEDB PASSWORD :'pw';
        SQL
        EOF
        chmod 0755 /docker-entrypoint-initdb.d/10-sealed-sample-role.sh
        exec docker-entrypoint.sh "$$@"
      - internal-tools-db
    command: ["postgres"]
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "postgres"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - internal-tools-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    shm_size: 256m
    mem_limit: 1g

  internal-tools-valkey:
    image: "{{image:valkey}}"
    x-sealed-secrets: [REDIS_PASSWORD]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        pass="$$REDIS_PASSWORD"
        unset REDIS_PASSWORD
        exec tini -- docker-entrypoint.sh "$$@" --requirepass "$$pass"
      - internal-tools-valkey
    # BullMQ (workflows) needs noeviction. Queue state is kept on the encrypted data disk.
    command: ["valkey-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - internal-tools-valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$(cat /run/sealed/secrets/internal-tools/REDIS_PASSWORD)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    mem_limit: 512m

  # One-shot job: first admin and workspace, then checks that self sign-up is refused.
  # The tools route stays closed until it writes internal-tools-bootstrap/done.json.
  internal-tools-bootstrap:
    image: "{{image:tooljet}}"
    user: "1000:1000"
    x-sealed-secrets: [ADMIN_EMAIL, ADMIN_PASSWORD]
    entrypoint: ["node"]
    command:
      - --input-type=module
      - --eval
      # >>> embedded: bootstrap/bootstrap.mjs (run tools/embed-bootstrap.mjs, do not edit here)
      - |
        // Sealed internal-tools bootstrap for ToolJet CE v3.20.
        //
        // Runs once inside the VM, against http://internal-tools-server:3000, before the tools route
        // opens: creates the first admin and the default workspace with the one-time
        // /api/onboarding/setup-super-admin endpoint (it only works while the instance has no users),
        // confirms the admin can log in, and confirms that self sign-up is refused. Safe to re-run.
        // This file is embedded verbatim into compose.fragment.yaml (tools/embed-bootstrap.mjs), so it
        // may only import node: builtins.
        //
        // Secrets (ADMIN_EMAIL, ADMIN_PASSWORD) arrive as env vars from envexec. They and the session
        // cookie are kept out of logs and error messages.

        import { mkdir, readFile, rename, writeFile } from "node:fs/promises";
        import { join } from "node:path";

        export const DONE_FILE = "done.json";
        export const SESSION_COOKIE = "tj_auth_token";

        export class BootstrapError extends Error {}

        function trimSlash(url) {
          return url.replace(/\/+$$/, "");
        }

        function positiveInt(env, name, fallback, max) {
          const value = Number(env[name] ?? String(fallback));
          if (!Number.isInteger(value) || value < 1 || value > max) {
            throw new BootstrapError(`$${name} must be an integer between 1 and $${max}`);
          }
          return value;
        }

        export function loadConfig(env) {
          const required = (name) => {
            const value = env[name];
            if (!value) throw new BootstrapError(`missing env $${name}`);
            return value;
          };
          const email = required("ADMIN_EMAIL").trim().toLowerCase();
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$$/.test(email)) throw new BootstrapError("ADMIN_EMAIL is not an email address");
          const password = required("ADMIN_PASSWORD");
          // ToolJet accepts 5 to 100 characters; Sealed asks for at least 8.
          if (password.length < 8 || password.length > 100) {
            throw new BootstrapError("ADMIN_PASSWORD must be 8 to 100 characters");
          }
          const origin = trimSlash(required("SEALED_PUBLIC_URL_TOOLS"));
          if (!/^https?:\/\/[^/]+$$/.test(origin)) throw new BootstrapError("SEALED_PUBLIC_URL_TOOLS must be a scheme and host with no path");
          return {
            baseUrl: trimSlash(required("TOOLS_BASE_URL")),
            origin,
            stateDir: required("STATE_DIR"),
            email,
            password,
            adminName: env.ADMIN_NAME || "Sealed Admin",
            workspaceName: env.WORKSPACE_NAME || "Internal tools",
            healthTimeoutMs: positiveInt(env, "HEALTH_TIMEOUT_S", 900, 86400) * 1000,
            pollMs: positiveInt(env, "POLL_INTERVAL_MS", 5000, 600000),
            headers: {},
          };
        }

        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        function describe(json) {
          const m = json?.message;
          return Array.isArray(m) ? m.join("; ") : typeof m === "string" ? m : "";
        }

        export async function request(cfg, method, path, { body, session, workspaceId } = {}) {
          const headers = { ...cfg.headers };
          if (body !== undefined) headers["content-type"] = "application/json";
          if (session) headers.cookie = [cfg.headers.cookie, session].filter(Boolean).join("; ");
          if (workspaceId) headers["tj-workspace-id"] = workspaceId;
          let res;
          try {
            res = await fetch(`$${cfg.baseUrl}$${path}`, {
              method,
              headers,
              body: body === undefined ? undefined : JSON.stringify(body),
              redirect: "manual",
            });
          } catch (err) {
            throw new BootstrapError(`$${method} $${path}: request failed ($${err.cause?.code ?? err.message})`);
          }
          const text = await res.text();
          let json;
          try {
            json = text ? JSON.parse(text) : undefined;
          } catch {
            json = undefined;
          }
          return {
            status: res.status,
            json,
            text,
            contentType: res.headers.get("content-type") ?? "",
            setCookies: res.headers.getSetCookie(),
          };
        }

        export function sessionFrom(setCookies) {
          const cookie = setCookies.find((c) => c.startsWith(`$${SESSION_COOKIE}=`));
          const pair = cookie?.split(";")[0];
          return pair && pair.length > SESSION_COOKIE.length + 1 ? pair : undefined;
        }

        function sessionResult(operation, res) {
          const session = sessionFrom(res.setCookies);
          const organizationId = res.json?.current_organization_id;
          if (!session || !organizationId) throw new BootstrapError(`$${operation}: response has no session or workspace`);
          return { session, organizationId };
        }

        export async function waitHealthy(cfg, log) {
          const deadline = Date.now() + cfg.healthTimeoutMs;
          for (;;) {
            try {
              const res = await fetch(`$${cfg.baseUrl}/api/health`, { headers: cfg.headers });
              if (res.status === 200) return;
            } catch {
              // server not listening yet
            }
            if (Date.now() >= deadline) throw new BootstrapError(`server not healthy after $${cfg.healthTimeoutMs / 1000}s`);
            log("waiting for internal-tools-server /api/health");
            await sleep(cfg.pollMs);
          }
        }

        // Creates the first admin and workspace. Returns undefined when the instance already has users
        // (ToolJet's FirstUserSignupGuard answers 403).
        export async function setupSuperAdmin(cfg) {
          const res = await request(cfg, "POST", "/api/onboarding/setup-super-admin", {
            body: { email: cfg.email, password: cfg.password, name: cfg.adminName, workspaceName: cfg.workspaceName },
          });
          if (res.status === 403) return undefined;
          if (res.status !== 200 && res.status !== 201) {
            throw new BootstrapError(`setup-super-admin: HTTP $${res.status} $${describe(res.json)}`.trim());
          }
          return sessionResult("setup-super-admin", res);
        }

        export async function login(cfg) {
          const res = await request(cfg, "POST", "/api/authenticate", { body: { email: cfg.email, password: cfg.password } });
          if (res.status !== 200 && res.status !== 201) {
            throw new BootstrapError(`authenticate: HTTP $${res.status} $${describe(res.json)}`.trim());
          }
          return sessionResult("authenticate", res);
        }

        // Guards run before validation in ToolJet (NestJS), so an empty body gets 403 when
        // DISABLE_SIGNUPS=true and 400 when sign-up is open. Either way no user is created.
        export async function verifySignupClosed(cfg) {
          const res = await request(cfg, "POST", "/api/onboarding/signup", { body: {} });
          if (res.status !== 403) throw new BootstrapError(`self sign-up is not closed (probe got HTTP $${res.status})`);
        }

        async function verifySession(cfg, { session, organizationId }) {
          const res = await request(cfg, "GET", "/api/apps?type=front-end", { session, workspaceId: organizationId });
          if (res.status !== 200) throw new BootstrapError(`GET /api/apps with the admin session: HTTP $${res.status}`);
        }

        async function readJson(file) {
          try {
            return JSON.parse(await readFile(file, "utf8"));
          } catch (err) {
            if (err.code === "ENOENT") return undefined;
            throw new BootstrapError(`cannot read $${file}: $${err.message}`);
          }
        }

        export async function bootstrap(cfg, { log = () => {}, now = () => Date.now() } = {}) {
          const doneFile = join(cfg.stateDir, DONE_FILE);
          const done = await readJson(doneFile);
          if (done?.complete === true) {
            log("already bootstrapped");
            return { status: "already-done", organizationId: done.organizationId };
          }
          await mkdir(cfg.stateDir, { recursive: true });
          await waitHealthy(cfg, log);

          log("creating the first admin and workspace");
          let session = await setupSuperAdmin(cfg);
          if (!session) {
            log("instance already has users, logging in as the admin");
            try {
              session = await login(cfg);
            } catch (err) {
              throw new BootstrapError(`the instance already has users and the admin cannot log in ($${err.message})`);
            }
          }
          await verifySession(cfg, session);
          log("checking that self sign-up is refused");
          await verifySignupClosed(cfg);

          const tmp = `$${doneFile}.tmp`;
          const record = {
            schema: "sealed-bootstrap-done/v1",
            app: "internal-tools",
            complete: true,
            completedAt: new Date(now()).toISOString(),
            organizationId: session.organizationId,
            url: cfg.origin,
          };
          await writeFile(tmp, `$${JSON.stringify(record, null, 2)}\n`, { mode: 0o644 });
          await rename(tmp, doneFile);
          log("bootstrap complete");
          return { status: "bootstrapped", organizationId: session.organizationId };
        }

        export async function run(env, log = (line) => console.log(`[internal-tools-bootstrap] $${line}`)) {
          try {
            await bootstrap(loadConfig(env), { log });
            return 0;
          } catch (err) {
            log(`failed: $${err instanceof BootstrapError ? err.message : "unexpected error"}`);
            if (!(err instanceof BootstrapError)) console.error(err?.stack ?? String(err));
            return 1;
          }
        }

        if (process.env.SEALED_BOOTSTRAP === "run") {
          process.exitCode = await run(process.env);
        }
      # <<< embedded
    environment:
      SEALED_BOOTSTRAP: "run"
      TOOLS_BASE_URL: "http://internal-tools-server:3000"
      STATE_DIR: "/sealed-bootstrap"
      ADMIN_NAME: "Sealed Admin"
      WORKSPACE_NAME: "Internal tools"
      HEALTH_TIMEOUT_S: "900"
    volumes:
      - internal-tools-bootstrap:/sealed-bootstrap
    depends_on:
      internal-tools-server:
        condition: service_healthy
    read_only: true
    mem_limit: 256m

volumes:
  internal-tools-db-data: {}
  internal-tools-valkey-data: {}
  internal-tools-bootstrap: {}
