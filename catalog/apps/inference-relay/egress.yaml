# Egress policy for inference-relay (INTERFACES section 7). Hashed as sha256(CJSON(parsed)).
version: 1
default_allow:
  - "rpc.tempo.xyz:443"
  - "inference.tinfoil.sh:443"
  - "github-proxy.tinfoil.sh:443"
  - "kds-proxy.tinfoil.sh:443"
  - "inference.phala.com:443"
  - "cloud-api.near.ai:443"
  - "api.trustedservices.intel.com:443"
  - "certificates.trustedservices.intel.com:443"
customer_additions_allowed: false
notes: >-
  rpc.tempo.xyz: verify and broadcast MPP charges, read escrow channel state, settle and close
  sessions. inference.tinfoil.sh: Tinfoil enclave attestation and inference (TLS pinned to the
  attested key); github-proxy.tinfoil.sh and kds-proxy.tinfoil.sh: the release digest, Sigstore
  bundle and AMD VCEK the official Tinfoil verifier fetches. inference.phala.com: Phala ACI report
  and inference (TLS pinned). cloud-api.near.ai: NEAR AI gateway attestation and inference (TLS
  pinned). api.trustedservices.intel.com and certificates.trustedservices.intel.com:
  Intel PCS collateral and root CA CRL for TDX quote verification (Phala, NEAR AI). Nothing else;
  the relay is operator-run, so no customer additions.
