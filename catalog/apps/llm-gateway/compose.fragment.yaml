# llm-gateway compose fragment (INTERFACES section 14).
# The composer adds networks, fixed IPs, DNS, proxy env, telemetry_off_env, envexec,
# secret mounts, restart and logging. All services sit on the shared apps network, so
# every app container can open a connection to them; none of them has a route out of
# the VM. What protects each one:
#   llm-gateway-litellm  LiteLLM virtual keys (the intended entry point, alias llm-gateway)
#   llm-gateway-db       Postgres password (scram-sha-256)
#   llm-gateway-ollama   sealed-ollama-gate: only llm-gateway-litellm (by DNS name) and
#                        loopback get an answer, and only inference/read endpoints
#   llm-gateway-keys     listens on nothing; provisions other apps' virtual keys so they
#                        never need the master key (images/litellm/app_keys.yaml)
services:
  llm-gateway-litellm:
    image: "{{image:litellm}}"
    entrypoint: ["/app/.venv/bin/python", "-I", "/etc/litellm/sealed_entrypoint.py"]
    command: ["--port", "4000", "--num_workers", "2"]
    x-sealed-secrets:
      - LITELLM_MASTER_KEY
      - LITELLM_SALT_KEY
      - POSTGRES_PASSWORD
      - BYOK_ROUTES_ENABLED
      - BYOK_TINFOIL_API_KEY
      - BYOK_REDPILL_API_KEY
      - BYOK_NEARAI_API_KEY
      - EXTERNAL_ROUTES_ENABLED
      - EXTERNAL_OPENAI_API_KEY
      - EXTERNAL_OPENROUTER_API_KEY
      - EXTERNAL_GROQ_API_KEY
      - EXTERNAL_MISTRAL_API_KEY
    environment:
      SEALED_SECRETS_DIR: /run/sealed/secrets/llm-gateway
      SEALED_LITELLM_RENDER_DIR: /run/litellm
      SEALED_DB_HOST: llm-gateway-db
      SEALED_USAGE_URL: http://sealed-agent:7070/v1/usage-events
      STORE_MODEL_IN_DB: "False"
      LITELLM_LOG: ERROR
      LITELLM_MODE: PRODUCTION
    tmpfs:
      - /run/litellm:size=4m,mode=0755
      - /tmp:size=256m,mode=1777
    depends_on:
      llm-gateway-db:
        condition: service_healthy
      llm-gateway-ollama:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -I
        - -c
        - "import sys, urllib.request as u; o = u.build_opener(u.ProxyHandler({})); sys.exit(0 if o.open('http://127.0.0.1:4000/health/liveliness', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s
    mem_limit: 2g
    stop_grace_period: 30s

  llm-gateway-db:
    image: "{{image:postgres}}"
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["postgres", "-c", "max_connections=50"]
    x-sealed-secrets:
      - POSTGRES_PASSWORD
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
    volumes:
      - llm-gateway-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "litellm", "-d", "litellm", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    shm_size: 128m
    mem_limit: 1g
    stop_grace_period: 60s

  llm-gateway-ollama:
    image: "{{image:local-model}}"
    # Ollama on loopback; the gate answers on :11434 to llm-gateway-litellm only.
    entrypoint: ["/usr/local/bin/sealed-ollama-gate"]
    command: ["-listen", "0.0.0.0:11434", "-upstream", "127.0.0.1:11435", "-allow-peer", "llm-gateway-litellm", "--", "/bin/ollama", "serve"]
    user: "10002:10002"
    read_only: true
    environment:
      HOME: /tmp/ollama
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      # Through the gate (loopback is admitted) to Ollama; the probe ignores HTTP_PROXY.
      test: ["CMD", "/usr/local/bin/sealed-ollama-gate", "probe", "http://127.0.0.1:11434/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 8g
    stop_grace_period: 10s

  llm-gateway-keys:
    image: "{{image:litellm}}"
    entrypoint: ["/app/.venv/bin/python", "-I", "/etc/litellm/sealed_keys.py"]
    user: "65534:65534"
    read_only: true
    x-sealed-secrets:
      - LITELLM_MASTER_KEY
      - APP_KEY_CODING_AGENT
    environment:
      SEALED_SECRETS_DIR: /run/sealed/secrets/llm-gateway
      SEALED_GATEWAY_URL: http://llm-gateway-litellm:4000
      SEALED_APP_KEYS_FILE: /etc/litellm/app_keys.yaml
      SEALED_KEYS_STATUS_FILE: /run/sealed-keys/status.json
      SEALED_KEYS_INTERVAL_S: "300"
    tmpfs:
      - /run/sealed-keys:size=1m,mode=1777
      - /tmp:size=16m,mode=1777
    depends_on:
      llm-gateway-litellm:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -I
        - -c
        - "import json, sys; sys.exit(0 if json.load(open('/run/sealed-keys/status.json')).get('ok') is True else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s
    mem_limit: 128m
    stop_grace_period: 5s

volumes:
  llm-gateway-pgdata: {}
