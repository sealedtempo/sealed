# Optional provider routes for the Sealed llm-gateway, rendered at boot by sealed_entrypoint.py.
#
# Each entry becomes one wildcard route "<family>/<id>/*" -> "openai/*" at api_base, with
# api_key "os.environ/<secret>". A route is rendered only when its secret exists in
# /run/sealed/secrets/llm-gateway/<secret> (or the env var exported by envexec) and the
# family's opt-in secret is "true": BYOK_ROUTES_ENABLED for byok, EXTERNAL_ROUTES_ENABLED
# for external. Both families send prompts out of the customer's cloud.
#
# Every host here must also be added by the customer as an egress addition
# ("llm-gateway": ["<host>:443"]); the release allows no egress by default.
#
# api_base values are VERIFY-AT-BUILD (checked against provider docs on each bump).

byok:
  # Confidential-computing providers. The provider says it runs inference in a TEE, but
  # nothing in this VM verifies that attestation (only the platform relay path is verified),
  # so these routes are labeled "data leaves your cloud" and need an explicit opt-in.
  - id: tinfoil
    name: Tinfoil
    secret: BYOK_TINFOIL_API_KEY
    api_base: https://inference.tinfoil.sh/v1
    egress: inference.tinfoil.sh:443
  - id: redpill
    name: Phala RedPill
    secret: BYOK_REDPILL_API_KEY
    api_base: https://api.redpill.ai/v1
    egress: api.redpill.ai:443
  - id: nearai
    name: NEAR AI Cloud
    secret: BYOK_NEARAI_API_KEY
    api_base: https://cloud-api.near.ai/v1
    egress: cloud-api.near.ai:443

external:
  # Ordinary hosted APIs. Prompts and outputs leave your cloud.
  - id: openai
    name: OpenAI
    secret: EXTERNAL_OPENAI_API_KEY
    api_base: https://api.openai.com/v1
    egress: api.openai.com:443
  - id: openrouter
    name: OpenRouter
    secret: EXTERNAL_OPENROUTER_API_KEY
    api_base: https://openrouter.ai/api/v1
    egress: openrouter.ai:443
  - id: groq
    name: Groq
    secret: EXTERNAL_GROQ_API_KEY
    api_base: https://api.groq.com/openai/v1
    egress: api.groq.com:443
  - id: mistral
    name: Mistral
    secret: EXTERNAL_MISTRAL_API_KEY
    api_base: https://api.mistral.ai/v1
    egress: api.mistral.ai:443
