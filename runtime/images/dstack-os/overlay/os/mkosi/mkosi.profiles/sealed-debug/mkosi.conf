#
# Sealed debug variant. It is always built together with the upstream prod
# profile (mkosi --profile=prod,sealed-debug), so it inherits every production
# removal: no getty, no login, no debug shell, no logind and no SSH daemon. The
# only difference is the sealed-logship component, which exports container
# logs to the customer project's Cloud Logging (Sealed spec 5.8). The image is
# registered with isDebug = true and the key broker never releases production
# secrets to it.
[Build]
Environment=SEALED_IMAGE_VARIANT=debug
