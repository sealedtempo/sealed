# Sealed: the magic SysRq key stays off (kb-4). The host owns the serial port,
# and with SysRq on, a serial BREAK plus one key can reboot, crash or dump the
# guest. The kernel is built without SysRq (CONFIG_MAGIC_SYSRQ=n), so this only
# takes effect if a later kernel config turns it on. The leading "-" makes
# systemd-sysctl ignore the missing key on a kernel without SysRq.
# check_image.py fails the build unless kernel.sysrq ends up 0.
-kernel.sysrq = 0
